function buildAirbnbUrl(dest, ci, co, guests, pet) {
  const p = new URLSearchParams({ query: dest+", NSW, Australia", checkin:ci, checkout:co, adults:guests, refinement_paths:"/homes", search_type:"filter_change" });
  if (pet) p.set("amenities[]","25");
  return `https://www.airbnb.com.au/s/${encodeURIComponent(dest+", NSW")}/homes?${p}`;
}
function buildStayzUrl(dest, ci, co, guests, pet) {
  const p = new URLSearchParams({ q:dest+" NSW", arrival:ci, departure:co, adults:guests });
  if (pet) p.set("pets","1");
  return `https://www.stayz.com.au/accommodation?${p}`;
}
function formatDate(d) { return d.toISOString().split("T")[0]; }
function getNextWeekend() {
  const t = new Date(), df = (5-t.getDay()+7)%7||7;
  const fri = new Date(t); fri.setDate(t.getDate()+df);
  const sun = new Date(fri); sun.setDate(fri.getDate()+2);
  return { checkIn: formatDate(fri), checkOut: formatDate(sun) };
}
function getSeason() {
  const m = new Date().getMonth();
  if (m>=2&&m<=4) return { name:"autumn", emoji:"🍂", banner:"Autumn colour & crisp air",   sub:"Perfect for wine country & mountain drives" };
  if (m>=5&&m<=7) return { name:"winter", emoji:"🔥", banner:"Winter cabin season is here", sub:"Log fires, misty valleys & cosy stays" };
  if (m>=8&&m<=10) return { name:"spring", emoji:"🌸", banner:"Spring is popping off",       sub:"Wildflowers, warm days & outdoor escapes" };
  return               { name:"summer", emoji:"☀️", banner:"Summer escape time",            sub:"Beaches, waterfalls & long evenings" };
}
const ls = {
  get: (k,fb) => { try { const v=localStorage.getItem(k); return v!==null?JSON.parse(v):fb; } catch { return fb; } },
  set: (k,v)  => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} },
  str: (k,fb) => { try { return localStorage.getItem(k)||fb; } catch { return fb; } },
  setStr:(k,v)=> { try { localStorage.setItem(k,v); } catch {} },
  del: (k)    => { try { localStorage.removeItem(k); } catch {} },
};

const BG = { minHeight:"100vh", background:"linear-gradient(160deg,#0f1a2e 0%,#0d1f1a 50%,#0a1510 100%)", fontFamily:"'DM Sans',sans-serif", color:"#f0ede6", position:"relative", overflowX:"hidden" };

function SettingsScreen({ currentKey, onSave, onBack }) {
  const [hasKey, setHasKey]     = useState(!!currentKey);
  const [key, setKey]           = useState("");
  const [error, setError]       = useState("");
  const [testing, setTesting]   = useState(false);
  const [saved, setSaved]       = useState(false);
  const [editing, setEditing]   = useState(!currentKey);

  async function handleSave() {
    const t = key.trim();
    if (!t.startsWith("sk-ant-")) { setError("Keys start with sk-ant- — check and try again."); return; }
    setTesting(true); setError("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json","x-api-key":t,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}, body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:10,messages:[{role:"user",content:"hi"}]}) });
      if (res.status===401) { setError("Invalid key — double-check and try again."); setTesting(false); return; }
      ls.setStr("skedaddle_apikey",t); onSave(t); setEditing(false); setHasKey(true); setSaved(true); setKey("");
    } catch { setError("Couldn't reach Anthropic — check your connection."); }
    setTesting(false);
  }
  function handleRemove() {
    if (!window.confirm("Remove your API key?")) return;
    ls.del("skedaddle_apikey"); onSave(""); setHasKey(false); setEditing(true); setSaved(false); setKey(""); setError("");
  }
  function clearData(type) {
    const labels={favs:"saved places",been:"been there list",history:"search history"};
    if (!window.confirm(`Clear your ${labels[type]}?`)) return;
    ls.del(`skedaddle_${type}`); window.location.reload();
  }
  const card = { background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:18,padding:22,marginBottom:14 };
  return <div style={BG}><Orbs />
    <div style={PAGE}>
      <div style={{ fontSize:11,letterSpacing:"0.2em",color:"#ffc850",textTransform:"uppercase",fontWeight:700,marginBottom:12 }}>Settings</div>
      <h2 style={{ fontFamily:"'Fraunces',serif",fontSize:34,fontWeight:900,margin:"0 0 32px",color:"#f8f4ee",letterSpacing:"-0.02em" }}>Your preferences</h2>
      <div style={card}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
          <div>
            <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#56c88c",fontWeight:700,textTransform:"uppercase",marginBottom:4 }}>Anthropic API Key</div>
            <div style={{ fontSize:13,color:"#6a6560" }}>Powers the AI search</div>
          </div>
          {hasKey&&!editing&&<button onClick={()=>{setKey("");setEditing(true);setSaved(false);setError("");}} style={{ background:"rgba(86,200,140,0.1)",border:"1px solid rgba(86,200,140,0.25)",borderRadius:10,padding:"6px 12px",color:"#56c88c",fontSize:12,cursor:"pointer",fontWeight:600,fontFamily:"'DM Sans',sans-serif" }}>Change</button>}
        </div>
        {hasKey&&!editing&&<>
          {saved&&<div style={{ display:"flex",alignItems:"center",gap:8,padding:"10px 14px",borderRadius:10,background:"rgba(86,200,140,0.08)",border:"1px solid rgba(86,200,140,0.2)",marginBottom:10 }}><span style={{ color:"#56c88c",fontSize:16 }}>✓</span><span style={{ fontSize:13,color:"#56c88c",fontWeight:600 }}>Key saved and verified</span></div>}
          <div style={{ display:"flex",alignItems:"center",gap:10 }}>
            <div style={{ flex:1,padding:"11px 14px",borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",fontSize:14,color:"#c8c3b8",fontFamily:"monospace" }}>sk-ant-••••••••••••</div>
            <button onClick={handleRemove} style={{ padding:"11px 14px",borderRadius:10,background:"rgba(255,80,80,0.08)",border:"1px solid rgba(255,80,80,0.18)",color:"#ff8080",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"'DM Sans',sans-serif" }}>Remove</button>
          </div>
        </>}
        {editing&&<>
          <input type="password" placeholder="sk-ant-api03-..." value={key} autoFocus onChange={e=>{setKey(e.target.value);setError("");}} style={{ width:"100%",padding:"12px 14px",borderRadius:11,background:"rgba(255,255,255,0.05)",border:error?"1px solid rgba(255,80,80,0.5)":"1px solid rgba(255,255,255,0.12)",color:"#f0ede6",fontSize:14,outline:"none",marginBottom:error?8:10,fontFamily:"'DM Sans',sans-serif" }} />
          {error&&<div style={{ fontSize:12,color:"#ff6060",marginBottom:10,lineHeight:1.5 }}>⚠️ {error}</div>}
          <div style={{ display:"flex",gap:8 }}>
            <button onClick={handleSave} disabled={!key.trim()||testing} style={{ flex:1,padding:11,borderRadius:10,background:key.trim()&&!testing?"linear-gradient(135deg,#56c88c,#2ea868)":"rgba(255,255,255,0.06)",color:key.trim()&&!testing?"#071a10":"#444",border:"none",cursor:key.trim()&&!testing?"pointer":"not-allowed",fontWeight:700,fontSize:13,fontFamily:"'DM Sans',sans-serif" }}>{testing?"Verifying...":"Save key"}</button>
            {hasKey&&<button onClick={()=>{setEditing(false);setKey("");setError("");}} style={{ padding:"11px 16px",borderRadius:10,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#9a958f",cursor:"pointer",fontSize:13,fontFamily:"'DM Sans',sans-serif" }}>Cancel</button>}
          </div>
          {error&&<button onClick={()=>{setKey("");setError("");}} style={{ marginTop:10,width:"100%",padding:10,borderRadius:10,background:"rgba(255,80,80,0.06)",border:"1px solid rgba(255,80,80,0.15)",color:"#ff8080",cursor:"pointer",fontSize:12,fontFamily:"'DM Sans',sans-serif" }}>Clear and try a different key</button>}
        </>}
        <div style={{ marginTop:12,fontSize:12,color:"#5a5550",lineHeight:1.6 }}>🔒 Stored on this device only. <a href="https://console.anthropic.com/keys" target="_blank" style={{ color:"#56c88c",textDecoration:"none" }}>Get a key →</a></div>
      </div>
      <div style={card}>
        <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#56c88c",fontWeight:700,textTransform:"uppercase",marginBottom:16 }}>Data & Storage</div>
        {[{k:"favs",label:"Saved places",icon:"⭐",desc:"Your bolthole list"},{k:"been",label:"Been there list",icon:"📍",desc:"Places you've visited"},{k:"history",label:"Search history",icon:"🕓",desc:"Your last 3 searches"}].map(item=>(
          <div key={item.k} style={{ display:"flex",alignItems:"center",gap:12,marginBottom:12 }}>
            <span style={{ fontSize:18,width:28,textAlign:"center",flexShrink:0 }}>{item.icon}</span>
            <div style={{ flex:1 }}><div style={{ fontSize:14,fontWeight:600,color:"#c8c3b8" }}>{item.label}</div><div style={{ fontSize:11,color:"#5a5550" }}>{item.desc}</div></div>
            <button onClick={()=>clearData(item.k)} style={{ padding:"6px 12px",borderRadius:9,background:"rgba(255,80,80,0.08)",border:"1px solid rgba(255,80,80,0.18)",color:"#ff8080",fontSize:11,cursor:"pointer",fontWeight:600,flexShrink:0,fontFamily:"'DM Sans',sans-serif" }}>Clear</button>
          </div>
        ))}
      </div>
      <div style={card}>
        <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#56c88c",fontWeight:700,textTransform:"uppercase",marginBottom:14 }}>About</div>
        {[{label:"App",value:"Skedaddle"},{label:"Version",value:"1.0.0"},{label:"Model",value:"claude-sonnet-4-6"}].map(row=>(
          <div key={row.label} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:10,marginBottom:10,borderBottom:"1px solid rgba(255,255,255,0.05)" }}>
            <span style={{ fontSize:13,color:"#6a6560" }}>{row.label}</span>
            <span style={{ fontSize:13,color:"#c8c3b8",fontWeight:600 }}>{row.value}</span>
          </div>
        ))}
      </div>
    </div>
    <NavBar left={<NavBtn onClick={onBack}>← Back</NavBtn>} />
  </div>;
}

function DestCard({ dest, index, checkIn, checkOut, guests, pet, favs, been, onFav, onDetail }) {
  const [visible, setVisible] = useState(false);
  const isFav   = favs.some(f=>f.destination===dest.destination);
  const visited = been.includes(dest.destination);
  useEffect(()=>{ const t=setTimeout(()=>setVisible(true),index*100); return ()=>clearTimeout(t); },[]);
  const accent = visited?"linear-gradient(90deg,#b088ff,#7c50e8)":isFav?"linear-gradient(90deg,#ffc850,#ff8c30)":"linear-gradient(90deg,#56c88c,#2ea868)";
  const bg     = visited?"rgba(168,120,255,0.04)":isFav?"rgba(255,200,80,0.04)":"rgba(255,255,255,0.035)";
  const border = visited?"1px solid rgba(168,120,255,0.2)":isFav?"1px solid rgba(255,200,80,0.3)":"1px solid rgba(255,255,255,0.09)";
  return <div onClick={()=>onDetail(dest)} style={{ opacity:visible?1:0,transform:visible?"translateY(0)":"translateY(24px)",transition:"all 0.5s cubic-bezier(0.22,1,0.36,1)",background:bg,border,borderRadius:22,padding:22,display:"flex",flexDirection:"column",gap:12,position:"relative",overflow:"hidden",cursor:"pointer" }}>
    <div style={{ position:"absolute",top:0,left:0,right:0,height:3,background:accent }} />
    <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start" }}>
      <div style={{ flex:1 }}>
        <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap" }}>
          <span style={{ fontSize:11,letterSpacing:"0.15em",color:"#56c88c",fontWeight:700,textTransform:"uppercase" }}>{dest.distance_from_sydney}</span>
          {pet&&<span style={{ fontSize:10,padding:"2px 8px",borderRadius:20,background:"rgba(255,200,80,0.15)",color:"#ffc850",border:"1px solid rgba(255,200,80,0.3)",fontWeight:700 }}>🐾 Pet friendly</span>}
          {visited&&<span style={{ fontSize:10,padding:"2px 8px",borderRadius:20,background:"rgba(168,120,255,0.15)",color:"#b088ff",border:"1px solid rgba(168,120,255,0.3)",fontWeight:700 }}>✓ Been here</span>}
        </div>
        <h3 style={{ margin:0,fontSize:21,fontWeight:900,color:"#f8f4ee",fontFamily:"'Fraunces',serif",lineHeight:1.15 }}>{dest.destination}</h3>
      </div>
      <div style={{ display:"flex",gap:6,marginLeft:10,flexShrink:0,alignItems:"center" }}>
        <span style={{ fontSize:24 }}>{dest.emoji}</span>
        <button onClick={e=>{e.stopPropagation();onFav(dest);}} style={{ width:32,height:32,borderRadius:9,border:"none",background:isFav?"rgba(255,200,80,0.18)":"rgba(255,255,255,0.06)",cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center" }}>{isFav?"⭐":"☆"}</button>
      </div>
    </div>
    <p style={{ margin:0,fontSize:14,color:"#b0aba4",lineHeight:1.7 }}>{dest.why_go}</p>
    <div style={{ display:"flex",gap:7,flexWrap:"wrap" }}>
      {(dest.best_for||[]).map(tag=><span key={tag} style={{ fontSize:11,padding:"4px 11px",borderRadius:20,background:"rgba(86,200,140,0.1)",color:"#56c88c",border:"1px solid rgba(86,200,140,0.22)" }}>{tag}</span>)}
    </div>
    {dest.whats_on && (
      <div style={{ display:"flex",alignItems:"flex-start",gap:9,padding:"10px 13px",background:"rgba(176,136,255,0.09)",border:"1px solid rgba(176,136,255,0.22)",borderRadius:12 }}>
        <span style={{ fontSize:14,flexShrink:0,marginTop:1 }}>📅</span>
        <div>
          <div style={{ fontSize:10,letterSpacing:"0.12em",color:"#b088ff",fontWeight:700,textTransform:"uppercase",marginBottom:3 }}>This weekend</div>
          <div style={{ fontSize:13,color:"#d0c8f0",lineHeight:1.5 }}>{dest.whats_on}</div>
        </div>
      </div>
    )}
    <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:2 }}>
      <span style={{ fontSize:12,color:"#5a5550",fontStyle:"italic" }}>Tap for details & map</span>
      <span style={{ fontSize:13,color:"#56c88c",fontWeight:700 }}>View →</span>
    </div>
  </div>;
}

function DetailScreen({ dest, checkIn, checkOut, guests, pet, favs, been, onFav, onBeen, onBack }) {
  const [shareState, setShareState] = useState(null);
  const isFav   = favs.some(f=>f.destination===dest.destination);

  async function doShare() {

    const text = `${dest.emoji} ${dest.destination} — ${dest.distance_from_sydney} from Sydney\n\n${dest.why_go}\n\n💡 ${dest.insider_tip}\n\nAirbnb: ${url}`;
    if (navigator.share) { try { await navigator.share({title:`Skedaddle to ${dest.destination}`,text}); setShareState("shared"); setTimeout(()=>setShareState(null),2000); } catch {} return; }
    try { await navigator.clipboard.writeText(text); setShareState("copied"); setTimeout(()=>setShareState(null),2200); } catch {}
  }
  return <div style={BG}><Orbs />
    <div style={PAGE}>
      <div style={{ background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:22,padding:28,marginBottom:14,position:"relative",overflow:"hidden" }}>
        <div style={{ position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#56c88c,#2ea868)" }} />
        <div style={{ fontSize:52,marginBottom:12 }}>{dest.emoji}</div>
        <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#56c88c",fontWeight:700,textTransform:"uppercase",marginBottom:6 }}>{dest.distance_from_sydney}</div>
        <h2 style={{ fontFamily:"'Fraunces',serif",fontWeight:900,fontSize:34,margin:"0 0 14px",color:"#f8f4ee",letterSpacing:"-0.02em",lineHeight:1.1 }}>{dest.destination}</h2>
        <p style={{ margin:"0 0 14px",fontSize:15,color:"#b0aba4",lineHeight:1.75 }}>{dest.why_go}</p>
        <div style={{ display:"flex",gap:7,flexWrap:"wrap" }}>
          {(dest.best_for||[]).map(tag=><span key={tag} style={{ fontSize:11,padding:"4px 11px",borderRadius:20,background:"rgba(86,200,140,0.1)",color:"#56c88c",border:"1px solid rgba(86,200,140,0.22)" }}>{tag}</span>)}
        </div>
      </div>
      {dest.whats_on&&<div style={{ background:"rgba(176,136,255,0.08)",border:"1px solid rgba(176,136,255,0.25)",borderRadius:16,padding:"16px 18px",marginBottom:14 }}>
        <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}>
          <span style={{ fontSize:18 }}>📅</span>
          <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#b088ff",fontWeight:700,textTransform:"uppercase" }}>What's on this weekend</div>
        </div>
        <p style={{ margin:0,fontSize:14,color:"#d0c8f0",lineHeight:1.7 }}>{dest.whats_on}</p>
      </div>}
      {dest.insider_tip&&<div style={{ background:"rgba(255,200,80,0.06)",border:"1px solid rgba(255,200,80,0.2)",borderRadius:16,padding:"16px 18px",marginBottom:14 }}>
        <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#ffc850",fontWeight:700,textTransform:"uppercase",marginBottom:8 }}>Insider tip</div>
        <p style={{ margin:0,fontSize:14,color:"#c8c3b4",lineHeight:1.7,fontStyle:"italic" }}>💡 {dest.insider_tip}</p>
      </div>}
      {dest.things_to_do&&dest.things_to_do.length>0&&<div style={{ background:"rgba(255,255,255,0.035)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:"16px 18px",marginBottom:14 }}>
        <div style={{ fontSize:11,letterSpacing:"0.15em",color:"#56c88c",fontWeight:700,textTransform:"uppercase",marginBottom:12 }}>Things to do</div>
        {dest.things_to_do.map((t,i)=><div key={i} style={{ display:"flex",gap:10,alignItems:"flex-start",marginBottom:8 }}><span style={{ color:"#56c88c",fontWeight:700,fontSize:13,flexShrink:0 }}>→</span><span style={{ fontSize:14,color:"#b0aba4",lineHeight:1.5 }}>{t}</span></div>)}
      </div>}
      <div style={{ display:"flex",gap:10,marginBottom:10 }}>
        <button onClick={()=>onFav(dest)} style={{ flex:1,padding:14,borderRadius:13,border:"none",background:isFav?"rgba(255,200,80,0.15)":"rgba(255,255,255,0.06)",color:isFav?"#ffc850":"#9a958f",cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif" }}>{isFav?"⭐ Saved":"☆ Save"}</button>
        <button onClick={()=>onBeen(dest.destination)} style={{ flex:1,padding:14,borderRadius:13,border:"none",background:visited?"rgba(168,120,255,0.15)":"rgba(255,255,255,0.06)",color:visited?"#b088ff":"#9a958f",cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif" }}>{visited?"✓ Been there":"📍 Been there?"}</button>
        <button onClick={doShare} style={{ width:50,padding:14,borderRadius:13,border:"none",background:shareState?"rgba(86,200,140,0.15)":"rgba(255,255,255,0.06)",color:shareState?"#56c88c":"#9a958f",cursor:"pointer",fontSize:16,fontFamily:"'DM Sans',sans-serif" }}>{shareState==="copied"?"✓":"↗"}</button>
      </div>
      {shareState==="copied"&&<div style={{ fontSize:12,color:"#56c88c",textAlign:"right",marginBottom:10 }}>Copied!</div>}
      <a href={`https://maps.google.com/?q=${encodeURIComponent(dest.destination+", NSW, Australia")}`} target="_blank" style={{ display:"flex",alignItems:"center",gap:10,padding:"14px 18px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:13,color:"#9a958f",fontSize:14,fontWeight:600,marginBottom:12,textDecoration:"none" }}>
        <span style={{ fontSize:18 }}>🗺️</span><span>Open in Google Maps</span><span style={{ marginLeft:"auto",opacity:0.5 }}>→</span>
      </a>
      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>

        <a href={buildStayzUrl(dest.destination,checkIn,checkOut,guests,pet)} target="_blank" style={{ display:"block",textAlign:"center",padding:15,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.13)",color:"#f0ede6",borderRadius:13,fontWeight:700,fontSize:14,textDecoration:"none" }}>Stayz →</a>
      </div>
    </div>
    <NavBar left={<NavBtn onClick={onBack}>← Results</NavBtn>} />
  </div>;
}

function SavedScreen({ favs, been, onFav, onBeen, onBack, onSettings }) {
  const nw = getNextWeekend();
  return <div style={BG}><Orbs />
    <div style={PAGE}>
      <div style={{ fontSize:11,letterSpacing:"0.2em",color:"#ffc850",textTransform:"uppercase",fontWeight:700,marginBottom:8 }}>Saved spots</div>
      <h2 style={{ fontFamily:"'Fraunces',serif",fontSize:32,fontWeight:900,margin:"0 0 6px",color:"#f8f4ee",letterSpacing:"-0.02em" }}>Your bolthole list</h2>
      <p style={{ fontSize:14,color:"#7a7570",margin:"0 0 28px" }}>{favs.length===0?"Nothing saved yet — star a destination.":`${favs.length} place${favs.length!==1?"s":""} on your list`}</p>
      <div style={{ display:"flex",flexDirection:"column",gap:18 }}>
        {favs.map((dest,i)=><DestCard key={dest.destination} dest={dest} index={i} checkIn={nw.checkIn} checkOut={nw.checkOut} guests={2} pet={false} favs={favs} been={been} onFav={onFav} onDetail={()=>{}} />)}
      </div>

    <NavBar left={<NavBtn onClick={onBack}>← Back</NavBtn>} right={<NavBtn onClick={onSettings}>⚙️ Settings</NavBtn>} />

function App() {
  const [screen, setScreen]       = useState("home");
  const [prevScreen, setPrev]     = useState("home");
  const [detailDest, setDetail]   = useState(null);
  const [vibe, setVibe]           = useState(null);
  const [distance, setDist]       = useState("3");
  const [group, setGroup]         = useState("couple");
  const nw = getNextWeekend();
  const [checkIn, setCI]          = useState(nw.checkIn);
  const [checkOut, setCO]         = useState(nw.checkOut);
  const [loading, setLoading]     = useState(false);
  const [results, setResults]     = useState(null);
  const [error, setError]         = useState(null);
  const [statusMsg, setStatus]    = useState("");
  const [pet, setPet]             = useState(false);
  const [apiKey, setApiKey]       = useState(()=>ls.str("skedaddle_apikey",""));
  const [onboarded, setOnboarded] = useState(()=>ls.get("skedaddle_onboarded",false));
  const [favs, setFavs]           = useState(()=>ls.get("skedaddle_favs",[]));
  const [been, setBeen]           = useState(()=>ls.get("skedaddle_been",[]));
  const [history, setHistory]     = useState(()=>ls.get("skedaddle_history",[]));

  const season = getSeason();
  const selG   = GROUPS.find(g=>g.id===group);
  const selV   = VIBES.find(v=>v.id===vibe);

  function goSettings() { setPrev(screen); setScreen("settings"); }
  function toggleFav(dest) {
    const next = favs.some(f=>f.destination===dest.destination) ? favs.filter(f=>f.destination!==dest.destination) : [...favs,dest];
    ls.set("skedaddle_favs",next); setFavs(next);
  }
  function toggleBeen(name) {
    const next = been.includes(name)?been.filter(n=>n!==name):[...been,name];
    ls.set("skedaddle_been",next); setBeen(next);
  }

  async function runFetch(ov={}) {
    const uv=ov.vibe!==undefined?ov.vibe:vibe, ud=ov.distance!==undefined?ov.distance:distance;
    const ug=ov.group!==undefined?ov.group:group, uci=ov.checkIn!==undefined?ov.checkIn:checkIn;
    const uco=ov.checkOut!==undefined?ov.checkOut:checkOut, up=ov.pet!==undefined?ov.pet:pet;
    const vObj=VIBES.find(x=>x.id===uv), gObj=GROUPS.find(x=>x.id===ug);
    setLoading(true); setError(null); setResults(null); setScreen("results");
    const entry={vibe:uv,distance:ud,group:ug,checkIn:uci,checkOut:uco,pet:up};
    const newH=[entry,...history.filter(h=>!(h.vibe===uv&&h.distance===ud&&h.group===ug))].slice(0,3);
    ls.set("skedaddle_history",newH); setHistory(newH);
    const prompt=`You are a local Sydney travel expert. It's ${season.name} in Sydney, Australia.\n${WORKER_URL ? "Use web search to find current events and conditions for these dates." : ""}\nSuggest weekend getaway destinations:\n- Vibe: ${vObj?vObj.label:""}\n- Max drive: ${ud} hours\n- Group: ${gObj?gObj.label:""} (${gObj?gObj.guests:2} guests)\n- Dates: ${uci} to ${uco}\n- Pet friendly: ${up?"YES":"No"}\n- Skip visited: ${been.length>0?been.join(", "):"none"}\nReturn ONLY a valid JSON array of exactly 6 objects, no markdown:\n[{"destination":"Name","emoji":"e","distance_from_sydney":"X hrs drive","why_go":"2-3 sentences","best_for":["t1","t2","t3"],"insider_tip":"tip","things_to_do":["t1","t2","t3"],"whats_on":"one current local event or market happening this specific weekend, or empty string if nothing notable"}]`;
    setStatus("Finding your next skedaddle...");

    // Demo mode — returns mock data without hitting the API
    if (DEMO_MODE) {
      const mock = await getMockResults();
      setResults(mock); setLoading(false); setStatus(""); return;
    }

    try {
      // Use Worker (with web search) if configured, else call Anthropic directly
      const usingWorker = !!WORKER_URL;
      const endpoint = usingWorker ? WORKER_URL : "https://api.anthropic.com/v1/messages";
      const headers = usingWorker
        ? { "Content-Type": "application/json" }
        : { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
      const body = usingWorker
        ? { messages: [{ role: "user", content: prompt }] }
        : { model: "claude-sonnet-4-6", max_tokens: 2000, messages: [{ role: "user", content: prompt }] };
      const res = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify(body) });
      if (!res.ok) {
        const e=await res.json().catch(()=>({}));
        if (res.status===401) setError("API key rejected — check Settings.");
        else if (res.status===429) setError("Rate limit hit — wait a moment and try again.");
        else setError(`API error ${res.status}: ${e&&e.error&&e.error.message?e.error.message:"please try again."}`);
        setLoading(false); setStatus(""); return;
      }
      const data=await res.json();
      const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      const match=text.match(/\[[\s\S]*\]/);
      if (!match) { setError("Unexpected response — please try again."); setLoading(false); setStatus(""); return; }
      setResults(JSON.parse(match[0]));
    } catch { setError("Can't reach Anthropic — check your connection."); }
    setLoading(false); setStatus("");
  }

  if (!onboarded) return <OnboardingScreen onDone={()=>{ls.set("skedaddle_onboarded",true);setOnboarded(true);}} />;
  if (screen==="settings") return <SettingsScreen currentKey={apiKey} onSave={k=>setApiKey(k)} onBack={()=>setScreen(prevScreen||"home")} />;
  if (screen==="saved") return <SavedScreen favs={favs} been={been} onFav={toggleFav} onBeen={toggleBeen} onBack={()=>setScreen("home")} onSettings={goSettings} />;
  if (screen==="detail"&&detailDest) return <DetailScreen dest={detailDest} checkIn={checkIn} checkOut={checkOut} guests={selG?selG.guests:2} pet={pet} favs={favs} been={been} onFav={toggleFav} onBeen={toggleBeen} onBack={()=>setScreen("results")} />;

  if (screen==="home") return <div style={BG}><Orbs />
    <div style={PAGE}>
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:32 }}>
        <div style={{ display:"flex",alignItems:"center",gap:8 }}>
          <span style={{ fontSize:22 }}>🏃</span>
          <span style={{ fontFamily:"'Fraunces',serif",fontWeight:900,fontSize:20,color:"#f8f4ee",letterSpacing:"-0.02em" }}>Skedaddle</span>
        </div>
        <SavedBadge count={favs.length} onClick={()=>setScreen("saved")} />
      </div>
      <div style={{ background:"rgba(255,200,80,0.07)",border:"1px solid rgba(255,200,80,0.2)",borderRadius:16,padding:"16px 18px",marginBottom:32,display:"flex",gap:14,alignItems:"center" }}>
        <span style={{ fontSize:28,flexShrink:0 }}>{season.emoji}</span>
        <div><div style={{ fontWeight:700,fontSize:14,color:"#ffc850",marginBottom:3 }}>{season.banner}</div><div style={{ fontSize:13,color:"#8a8070" }}>{season.sub}</div></div>
      </div>
      {!apiKey&&!DEMO_MODE&&<div onClick={goSettings} style={{ background:"rgba(255,200,80,0.08)",border:"1px solid rgba(255,200,80,0.25)",borderRadius:14,padding:"12px 16px",marginBottom:20,display:"flex",alignItems:"center",gap:12,cursor:"pointer" }}>
        <span style={{ fontSize:20,flexShrink:0 }}>🔑</span>
        <div style={{ flex:1 }}><div style={{ fontSize:13,fontWeight:700,color:"#ffc850",marginBottom:2 }}>Add your API key to get started</div><div style={{ fontSize:12,color:"#8a8070" }}>Tap to open Settings</div></div>
        <span style={{ fontSize:12,color:"#ffc850",opacity:0.7 }}>→</span>
      </div>}
      <div style={{ fontSize:12,letterSpacing:"0.2em",color:"#ffc850",textTransform:"uppercase",fontWeight:700,marginBottom:16 }}>Weekend escapes from Sydney</div>
      <h1 style={{ fontFamily:"'Fraunces',serif",fontWeight:900,fontSize:"clamp(44px,11vw,60px)",lineHeight:1.0,margin:"0 0 18px",color:"#f8f4ee",letterSpacing:"-0.02em" }}>Time to<br /><span style={{ color:"#56c88c" }}>skedaddle.</span></h1>
      <p style={{ fontSize:15,color:"#7a7570",lineHeight:1.7,margin:"0 0 36px",maxWidth:320 }}>Tell us your vibe. We'll find where to bolt to this weekend — fresh ideas every time.</p>
      {history.length>0&&<div style={{ marginBottom:32 }}>
        <div style={{ fontSize:11,letterSpacing:"0.18em",color:"#56c88c",textTransform:"uppercase",marginBottom:13,fontWeight:700 }}>Recent searches</div>
        {history.map((e,i)=>{
          const v=VIBES.find(x=>x.id===e.vibe), g=GROUPS.find(x=>x.id===e.group);
          return <button key={i} onClick={()=>{setVibe(e.vibe);setDist(e.distance);setGroup(e.group);setCI(e.checkIn);setCO(e.checkOut);setPet(e.pet||false);runFetch(e);}} style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",textAlign:"left",width:"100%",marginBottom:8,fontFamily:"'DM Sans',sans-serif" }}>
            <span style={{ fontSize:22,flexShrink:0 }}>{v?v.emoji:""}</span>
            <div style={{ flex:1,minWidth:0 }}><div style={{ fontSize:13,fontWeight:700,color:"#c8c3b8",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{v?v.label:""} · {e.distance}hr · {g?g.label:""}</div><div style={{ fontSize:11,color:"#5a5550" }}>{e.checkIn} → {e.checkOut}</div></div>
            <span style={{ fontSize:13,color:"#56c88c",fontWeight:700,flexShrink:0 }}>Rerun →</span>
          </button>;
        })}
      </div>}
    </div>
    <NavBar left={<NavBtn onClick={goSettings}>⚙️</NavBtn>} right={<NavBtn onClick={()=>{if(!DEMO_MODE&&!apiKey){goSettings();return;}setScreen("filters");}} accent={true}>{DEMO_MODE?"Let's go →":apiKey?"Let's go →":"Set API key"}</NavBtn>} />
  </div>;

  if (screen==="filters") return <div style={BG}><Orbs />
    <div style={PAGE}>
      <h2 style={{ fontFamily:"'Fraunces',serif",fontSize:34,fontWeight:900,margin:"0 0 30px",color:"#f8f4ee",letterSpacing:"-0.02em" }}>Plan the skedaddle</h2>
      <Section label="When are you going?">
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12 }}>
          {[{label:"Check in",val:checkIn,set:setCI},{label:"Check out",val:checkOut,set:setCO}].map(f=>(
            <div key={f.label}>
              <div style={{ fontSize:11,color:"#56c88c",letterSpacing:"0.1em",marginBottom:6,textTransform:"uppercase",fontWeight:700 }}>{f.label}</div>
              <input type="date" value={f.val} onChange={e=>f.set(e.target.value)} style={{ width:"100%",padding:12,borderRadius:11,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.11)",color:"#f0ede6",fontSize:14,outline:"none",colorScheme:"dark" }} />
            </div>
          ))}
        </div>
      </Section>
      <Section label="Who's coming?">
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
          {GROUPS.map(g=><OptionCard key={g.id} selected={group===g.id} onClick={()=>setGroup(g.id)}><span style={{ fontSize:22 }}>{g.emoji}</span><span style={{ fontSize:14,fontWeight:600 }}>{g.label}</span></OptionCard>)}
        </div>
      </Section>
      <Section label="How far will you drive?">
        <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
          {DISTANCES.map(d=><OptionCard key={d.id} selected={distance===d.id} onClick={()=>setDist(d.id)} horizontal><div><div style={{ fontWeight:700,fontSize:15 }}>{d.label}</div><div style={{ fontSize:12,color:"#6a6560",marginTop:2 }}>{d.desc}</div></div></OptionCard>)}
        </div>
      </Section>
      <Section label="What's the vibe?">
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
          {VIBES.map(v=><OptionCard key={v.id} selected={vibe===v.id} onClick={()=>setVibe(v.id)}><span style={{ fontSize:24 }}>{v.emoji}</span><span style={{ fontSize:13,fontWeight:600,textAlign:"center" }}>{v.label}</span></OptionCard>)}
        </div>
      </Section>
      <Section label="Any extras?">
        <button onClick={()=>setPet(p=>!p)} style={{ width:"100%",padding:"16px 20px",borderRadius:14,background:pet?"rgba(255,200,80,0.1)":"rgba(255,255,255,0.04)",border:pet?"1px solid rgba(255,200,80,0.4)":"1px solid rgba(255,255,255,0.08)",color:pet?"#ffc850":"#9a958f",cursor:"pointer",display:"flex",alignItems:"center",gap:14,transition:"all 0.2s",fontFamily:"'DM Sans',sans-serif" }}>
          <span style={{ fontSize:26 }}>🐾</span>
          <div style={{ textAlign:"left",flex:1 }}><div style={{ fontWeight:700,fontSize:15 }}>Bringing a pet?</div><div style={{ fontSize:12,opacity:0.65,marginTop:2 }}>Filter for pet-friendly stays</div></div>
          <div style={{ width:44,height:26,borderRadius:13,background:pet?"#ffc850":"rgba(255,255,255,0.1)",position:"relative",flexShrink:0,transition:"background 0.2s" }}>
            <div style={{ position:"absolute",top:3,left:pet?21:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.3)" }} />
          </div>
        </button>
      </Section>
    </div>
    <NavBar left={<NavBtn onClick={()=>setScreen("home")}>← Back</NavBtn>} right={<NavBtn onClick={()=>runFetch()} accent={!!vibe}>Skedaddle! ✨</NavBtn>} />
  </div>;

  return <div style={BG}><Orbs />
    <div style={PAGE}>
      <div style={{ marginBottom:28 }}>
        <div style={{ fontSize:11,letterSpacing:"0.18em",color:"#56c88c",textTransform:"uppercase",fontWeight:700,marginBottom:8 }}>{selV?selV.emoji:""} {selV?selV.label:""} · {distance}hr · {selG?selG.label:""}{pet?" · 🐾":""}</div>
        <h2 style={{ fontFamily:"'Fraunces',serif",fontSize:32,fontWeight:900,margin:0,color:"#f8f4ee",letterSpacing:"-0.02em" }}>Time to skedaddle!</h2>
        {DEMO_MODE && <div style={{ marginTop:10,padding:"8px 14px",background:"rgba(255,200,80,0.1)",border:"1px solid rgba(255,200,80,0.25)",borderRadius:10,fontSize:12,color:"#ffc850" }}>🧪 Demo mode — sample destinations, no API needed</div>}
        {!DEMO_MODE && WORKER_URL && <div style={{ marginTop:10,padding:"8px 14px",background:"rgba(176,136,255,0.1)",border:"1px solid rgba(176,136,255,0.25)",borderRadius:10,fontSize:12,color:"#b088ff" }}>🔍 Live web search enabled</div>}
      </div>
      {loading&&<div style={{ textAlign:"center",padding:"80px 0" }}>
        <div style={{ fontSize:42,marginBottom:20,display:"inline-block",animation:"bounce 0.8s ease-in-out infinite alternate" }}>🏃</div>
        <div style={{ color:"#56c88c",fontSize:14,letterSpacing:"0.1em" }}>{statusMsg}</div>
      </div>}
      {error&&<div style={{ textAlign:"center",padding:"60px 0" }}>
        <div style={{ fontSize:32,marginBottom:16 }}>😅</div>
        <div style={{ color:"#9a958f",marginBottom:24,fontSize:14,lineHeight:1.6 }}>{error}</div>
        <button onClick={()=>runFetch()} style={{ padding:"12px 28px",borderRadius:12,background:"#56c88c",color:"#071a10",border:"none",cursor:"pointer",fontWeight:700,fontFamily:"'DM Sans',sans-serif" }}>Try again</button>
      </div>}
      {results&&<div style={{ display:"flex",flexDirection:"column",gap:16 }}>
        {results.map((dest,i)=><DestCard key={i} dest={dest} index={i} checkIn={checkIn} checkOut={checkOut} guests={selG?selG.guests:2} pet={pet} favs={favs} been={been} onFav={toggleFav} onDetail={d=>{setDetail(d);setScreen("detail");}} />)}
        <button onClick={()=>runFetch()} style={{ marginTop:8,padding:16,borderRadius:14,background:"rgba(86,200,140,0.08)",border:"1px solid rgba(86,200,140,0.22)",color:"#56c88c",cursor:"pointer",fontSize:15,fontWeight:700,fontFamily:"'DM Sans',sans-serif" }}>🏃 Skedaddle somewhere else</button>
      </div>}
    </div>
    <NavBar left={<NavBtn onClick={()=>setScreen("filters")}>← Filters</NavBtn>} center={<SavedBadge count={favs.length} onClick={()=>setScreen("saved")} />} right={<NavBtn onClick={goSettings}>⚙️</NavBtn>} />
  </div>;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));

</script>
</body>
</html>
