<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#0d1f1a" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Skedaddle" />
  <meta property="og:title" content="Skedaddle" />
  <meta property="og:description" content="Weekend escape inspiration from Sydney — powered by AI" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    input[type="password"]::placeholder { color: #4a4a4a; }
    @keyframes bounce { from { transform: translateY(0) } to { transform: translateY(-12px) } }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── CONSTANTS ─────────────────────────────────────────────────
const AIRBNB_BASE = "https://www.airbnb.com.au/s";
const STAYZ_BASE  = "https://www.stayz.com.au/accommodation";

const VIBES = [
  { id: "cabin",     label: "Cabin & Treehouse", emoji: "🌲" },
  { id: "beach",     label: "Beach Escape",       emoji: "🏖️" },
  { id: "eco",       label: "Eco & Off-Grid",     emoji: "🌿" },
  { id: "wine",      label: "Wine & Foodie",       emoji: "🍷" },
  { id: "family",    label: "Family Friendly",     emoji: "👨‍👩‍👧" },
  { id: "adventure", label: "Adventure & Hiking",  emoji: "🥾" },
  { id: "wellness",  label: "Wellness & Slow",     emoji: "💆" },
  { id: "hidden",    label: "Hidden Gems",         emoji: "✨" },
];

const DISTANCES = [
  { id: "2", label: "2 hrs", desc: "Blue Mountains, Central Coast" },
  { id: "3", label: "3 hrs", desc: "South Coast, Jervis Bay" },
  { id: "4", label: "4 hrs", desc: "Snowy Mountains, Mudgee" },
];

const GROUPS = [
  { id: "solo",    label: "Solo",    emoji: "🧍", guests: 1 },
  { id: "couple",  label: "Couple",  emoji: "👫", guests: 2 },
  { id: "family",  label: "Family",  emoji: "👨‍👩‍👧", guests: 4 },
  { id: "friends", label: "Friends", emoji: "👥", guests: 4 },
];

// ── HELPERS ───────────────────────────────────────────────────
function buildAirbnbUrl(destination, checkIn, checkOut, guests, petFriendly) {
  const params = new URLSearchParams({
    query: `${destination}, NSW, Australia`,
    checkin: checkIn, checkout: checkOut, adults: guests,
    refinement_paths: "/homes", search_type: "filter_change",
  });
  if (petFriendly) params.set("amenities[]", "25");
  return `${AIRBNB_BASE}/${encodeURIComponent(destination + ", NSW")}/homes?${params}`;
}

function buildStayzUrl(destination, checkIn, checkOut, guests, petFriendly) {
  const params = new URLSearchParams({ q: `${destination} NSW`, arrival: checkIn, departure: checkOut, adults: guests });
  if (petFriendly) params.set("pets", "1");
  return `${STAYZ_BASE}?${params}`;
}

function buildMapsUrl(dest) {
  return `https://maps.google.com/?q=${encodeURIComponent(dest + ", NSW, Australia")}`;
}

function formatDate(d) { return d.toISOString().split("T")[0]; }

function getNextWeekend() {
  const today = new Date();
  const daysToFriday = (5 - today.getDay() + 7) % 7 || 7;
  const friday = new Date(today);
  friday.setDate(today.getDate() + daysToFriday);
  const sunday = new Date(friday);
  sunday.setDate(friday.getDate() + 2);
  return { checkIn: formatDate(friday), checkOut: formatDate(sunday) };
}

function getSeason() {
  const m = new Date().getMonth();
  if (m >= 2 && m <= 4) return { name: "autumn", emoji: "🍂", banner: "Autumn colour & crisp air",   sub: "Perfect for wine country & mountain drives" };
  if (m >= 5 && m <= 7) return { name: "winter", emoji: "🔥", banner: "Winter cabin season is here", sub: "Log fires, misty valleys & cosy stays" };
  if (m >= 8 && m <= 10) return { name: "spring", emoji: "🌸", banner: "Spring is popping off",       sub: "Wildflowers, warm days & outdoor escapes" };
  return                          { name: "summer", emoji: "☀️", banner: "Summer escape time",          sub: "Beaches, waterfalls & long evenings" };
}

// ── LOCAL STORAGE ─────────────────────────────────────────────
const ls = {
  get: (k, fb) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fb; } catch { return fb; } },
  set: (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  str: (k, fb) => { try { return localStorage.getItem(k) || fb; } catch { return fb; } },
  setStr: (k,v)=> { try { localStorage.setItem(k, v); } catch {} },
  del: (k)     => { try { localStorage.removeItem(k); } catch {} },
};

// ── SHARE ─────────────────────────────────────────────────────
async function shareDestination(dest, checkIn, checkOut, guests, petFriendly) {
  const url = buildAirbnbUrl(dest.destination, checkIn, checkOut, guests, petFriendly);
  const text = `${dest.emoji} ${dest.destination} — ${dest.distance_from_sydney} from Sydney\n\n${dest.why_go}\n\n💡 ${dest.insider_tip}\n\nSearch Airbnb: ${url}`;
  if (navigator.share) { try { await navigator.share({ title: `Skedaddle to ${dest.destination}`, text }); return true; } catch {} }
  try { await navigator.clipboard.writeText(text); return "copied"; } catch {}
  return false;
}

// ── SHARED STYLES ─────────────────────────────────────────────
const BG = {
  minHeight: "100vh",
  background: "linear-gradient(160deg, #0f1a2e 0%, #0d1f1a 50%, #0a1510 100%)",
  fontFamily: "'DM Sans', sans-serif", color: "#f0ede6",
  position: "relative", overflowX: "hidden",
};

const Orbs = () => (
  <>
    <div style={{ position:"fixed", top:"-15%", right:"-8%", width:480, height:480, borderRadius:"50%", background:"radial-gradient(circle, rgba(255,200,80,0.1) 0%, transparent 70%)", pointerEvents:"none", zIndex:0 }} />
    <div style={{ position:"fixed", bottom:"-12%", left:"-8%", width:420, height:420, borderRadius:"50%", background:"radial-gradient(circle, rgba(86,200,140,0.09) 0%, transparent 70%)", pointerEvents:"none", zIndex:0 }} />
  </>
);

const Wrap = ({ children, pad = "32px 24px 60px" }) => (
  <div style={{ maxWidth:480, margin:"0 auto", padding:pad, position:"relative", zIndex:1 }}>
    {children}
  </div>
);

const BackBtn = ({ onClick, label="← Back" }) => (
  <button onClick={onClick} style={{ background:"none", border:"none", color:"#56c88c", cursor:"pointer", fontSize:14, padding:0, marginBottom:24, fontFamily:"'DM Sans', sans-serif" }}>
    {label}

);

const GreenBtn = ({ onClick, disabled, children }) => (
  <button onClick={onClick} disabled={disabled} style={{
    width:"100%", padding:18, borderRadius:16,
    background: disabled ? "rgba(255,255,255,0.06)" : "linear-gradient(135deg, #56c88c, #2ea868)",
    color: disabled ? "#444" : "#071a10",
    border:"none", cursor: disabled ? "not-allowed" : "pointer",
    fontSize:17, fontWeight:700, letterSpacing:"0.02em",
    fontFamily:"'DM Sans', sans-serif", transition:"all 0.2s",
  }}>
    {children}
  </button>
);

const Label = ({ children }) => (
  <div style={{ fontSize:11, letterSpacing:"0.18em", color:"#56c88c", textTransform:"uppercase", marginBottom:13, fontWeight:700 }}>
    {children}
  </div>
);

const Section = ({ label, children }) => (
  <div style={{ marginBottom:26 }}>
    <Label>{label}</Label>
    {children}
  </div>
);

const OptionCard = ({ selected, onClick, children, horizontal }) => (
  <button onClick={onClick} style={{
    padding: horizontal ? "14px 16px" : "16px 12px", borderRadius:13,
    background: selected ? "rgba(86,200,140,0.13)" : "rgba(255,255,255,0.04)",
    border: selected ? "1px solid rgba(86,200,140,0.45)" : "1px solid rgba(255,255,255,0.08)",
    color: selected ? "#56c88c" : "#9a958f",
    cursor:"pointer", display:"flex",
    flexDirection: horizontal ? "row" : "column",
    alignItems:"center", gap: horizontal ? 14 : 8,
    fontFamily:"'DM Sans', sans-serif", textAlign:"left", transition:"all 0.15s", width:"100%",
  }}>
    {children}
  </button>
);

const SavedBadge = ({ count, onClick }) => (
  <button onClick={onClick} style={{
    background: count > 0 ? "rgba(255,200,80,0.12)" : "rgba(255,255,255,0.06)",
    border: count > 0 ? "1px solid rgba(255,200,80,0.28)" : "1px solid rgba(255,255,255,0.1)",
    borderRadius:20, padding:"6px 14px",
    color: count > 0 ? "#ffc850" : "#7a7570",
    fontSize:13, cursor:"pointer",
    fontFamily:"'DM Sans', sans-serif", fontWeight:700, transition:"all 0.2s",
  }}>
    ⭐ {count > 0 ? `${count} saved` : "Saved"}
  </button>
);

const H1 = ({ children }) => (
  <h1 style={{ fontFamily:"'Fraunces', serif", fontWeight:900, fontSize:"clamp(44px, 11vw, 60px)", lineHeight:1.0, margin:"0 0 18px", color:"#f8f4ee", letterSpacing:"-0.02em" }}>
    {children}
  </h1>
);

const H2 = ({ children }) => (
  <h2 style={{ fontFamily:"'Fraunces', serif", fontSize:32, fontWeight:900, margin:0, color:"#f8f4ee", letterSpacing:"-0.02em" }}>
    {children}
  </h2>
);

// ── API KEY SCREEN ────────────────────────────────────────────
function ApiKeyScreen({ onSave }) {
  const [key, setKey]       = useState("");
  const [error, setError]   = useState("");
  const [testing, setTesting] = useState(false);

  async function handleSave() {
    const trimmed = key.trim();
    if (!trimmed.startsWith("sk-ant-")) {
      setError("That doesn't look right — Anthropic keys start with sk-ant-");
      return;
    }
    setTesting(true); setError("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type":"application/json", "x-api-key": trimmed, "anthropic-version":"2023-06-01" },
        body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens:10, messages:[{ role:"user", content:"hi" }] }),
      });
      if (res.status === 401) { setError("Invalid key — double-check and try again."); setTesting(false); return; }
      ls.setStr("skedaddle_apikey", trimmed);
      onSave(trimmed);
    } catch {
      setError("Couldn't verify the key. Check your connection and try again.");
    }
    setTesting(false);
  }

  return (
    <div style={BG}>
      <Orbs />
      <Wrap pad="64px 24px 40px">
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:48 }}>
          <span style={{ fontSize:22 }}>🏃</span>
          <span style={{ fontFamily:"'Fraunces', serif", fontWeight:900, fontSize:20, color:"#f8f4ee", letterSpacing:"-0.02em" }}>Skedaddle</span>
        </div>

        <div style={{ fontSize:12, letterSpacing:"0.2em", color:"#ffc850", textTransform:"uppercase", fontWeight:700, marginBottom:16 }}>
          One-time setup
        </div>
        <h1 style={{ fontFamily:"'Fraunces', serif", fontWeight:900, fontSize:"clamp(36px, 9vw, 48px)", lineHeight:1.05, margin:"0 0 16px", color:"#f8f4ee", letterSpacing:"-0.02em" }}>
          Add your<br /><span style={{ color:"#56c88c" }}>API key.</span>
        </h1>
        <p style={{ fontSize:15, color:"#7a7570", lineHeight:1.7, margin:"0 0 6px" }}>
          Skedaddle uses the Anthropic API to find your escapes. Your key is stored only on this device — never sent anywhere else.
        </p>
        <a href="https://console.anthropic.com/keys" target="_blank" rel="noopener noreferrer"
          style={{ fontSize:13, color:"#56c88c", textDecoration:"none", display:"inline-block", marginBottom:36 }}>
          Get your key at console.anthropic.com →
        </a>

        <div style={{ marginBottom:12 }}>
          <Label>Anthropic API Key</Label>
          <input
            type="password"
            placeholder="sk-ant-api03-..."
            value={key}
            onChange={e => { setKey(e.target.value); setError(""); }}
            style={{
              width:"100%", padding:"14px 16px", borderRadius:13,
              background:"rgba(255,255,255,0.05)",
              border: error ? "1px solid rgba(255,80,80,0.5)" : "1px solid rgba(255,255,255,0.12)",
              color:"#f0ede6", fontSize:15, fontFamily:"'DM Sans', sans-serif",
              outline:"none", letterSpacing:"0.05em",
            }}
          />
        </div>

        {error && <div style={{ fontSize:13, color:"#ff6060", marginBottom:16, lineHeight:1.5 }}>⚠️ {error}</div>}

        <div style={{ background:"rgba(255,200,80,0.06)", border:"1px solid rgba(255,200,80,0.18)", borderRadius:12, padding:"14px 16px", marginBottom:32 }}>
          <div style={{ fontSize:12, color:"#8a8070", lineHeight:1.6 }}>
            🔒 Stored in <strong style={{ color:"#c8c3b4" }}>localStorage</strong> on this device only. Never included in any network request except directly to Anthropic.
          </div>
        </div>

        <GreenBtn onClick={handleSave} disabled={!key.trim() || testing}>
          {testing ? "Verifying key..." : "Save & start skedaddling →"}
        </GreenBtn>
      </Wrap>
    </div>
  );
}

// ── DESTINATION CARD ──────────────────────────────────────────
function DestinationCard({ dest, index, checkIn, checkOut, guests, petFriendly, favourites, beenThere, onToggleFav, onToggleBeenThere, onOpenDetail }) {
  const [visible, setVisible] = useState(false);
  const isFav      = favourites.some(f => f.destination === dest.destination);
  const hasVisited = beenThere.includes(dest.destination);

  useEffect(() => {
    const t = setTimeout(() => setVisible(true), index * 100);
    return () => clearTimeout(t);
  }, [index]);

  const accentColor = hasVisited ? "linear-gradient(90deg,#b088ff,#7c50e8)" : isFav ? "linear-gradient(90deg,#ffc850,#ff8c30)" : "linear-gradient(90deg,#56c88c,#2ea868)";
  const cardBorder  = hasVisited ? "1px solid rgba(168,120,255,0.2)" : isFav ? "1px solid rgba(255,200,80,0.3)" : "1px solid rgba(255,255,255,0.09)";
  const cardBg      = hasVisited ? "rgba(168,120,255,0.04)" : isFav ? "rgba(255,200,80,0.04)" : "rgba(255,255,255,0.035)";

  return (
    <div onClick={() => onOpenDetail(dest)} style={{
      opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(24px)",
      transition:"all 0.5s cubic-bezier(0.22,1,0.36,1)",
      background: cardBg, border: cardBorder,
      borderRadius:22, padding:22, display:"flex", flexDirection:"column", gap:12,
      position:"relative", overflow:"hidden", cursor:"pointer",
    }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:accentColor, opacity:0.85 }} />

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
        <div style={{ flex:1 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, flexWrap:"wrap" }}>
            <span style={{ fontSize:11, letterSpacing:"0.15em", color:"#56c88c", fontWeight:700, textTransform:"uppercase" }}>{dest.distance_from_sydney}</span>
            {petFriendly && <span style={{ fontSize:10, padding:"2px 8px", borderRadius:20, background:"rgba(255,200,80,0.15)", color:"#ffc850", border:"1px solid rgba(255,200,80,0.3)", fontWeight:700 }}>🐾 Pet friendly</span>}
            {hasVisited  && <span style={{ fontSize:10, padding:"2px 8px", borderRadius:20, background:"rgba(168,120,255,0.15)", color:"#b088ff", border:"1px solid rgba(168,120,255,0.3)", fontWeight:700 }}>✓ Been here</span>}
          </div>
          <h3 style={{ margin:0, fontSize:21, fontWeight:900, color:"#f8f4ee", fontFamily:"'Fraunces', serif", lineHeight:1.15 }}>{dest.destination}</h3>
        </div>
        <div style={{ display:"flex", gap:6, marginLeft:10, flexShrink:0, alignItems:"center" }}>
          <span style={{ fontSize:24 }}>{dest.emoji}</span>
          <button onClick={e => { e.stopPropagation(); onToggleFav(dest); }} style={{
            width:32, height:32, borderRadius:9, border:"none",
            background: isFav ? "rgba(255,200,80,0.18)" : "rgba(255,255,255,0.06)",
            cursor:"pointer", fontSize:15, display:"flex", alignItems:"center", justifyContent:"center",
          }}>
            {isFav ? "⭐" : "☆"}
          </button>
        </div>
      </div>

      <p style={{ margin:0, fontSize:14, color:"#b0aba4", lineHeight:1.7 }}>{dest.why_go}</p>

      <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
        {(dest.best_for || []).map(tag => (
          <span key={tag} style={{ fontSize:11, padding:"4px 11px", borderRadius:20, background:"rgba(86,200,140,0.1)", color:"#56c88c", border:"1px solid rgba(86,200,140,0.22)" }}>{tag}</span>
        ))}
      </div>

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:2 }}>
        <span style={{ fontSize:12, color:"#5a5550", fontStyle:"italic" }}>Tap for details & map</span>
        <span style={{ fontSize:13, color:"#56c88c", fontWeight:700 }}>View →</span>
      </div>
    </div>
  );
}

// ── DETAIL SCREEN ─────────────────────────────────────────────
function DetailScreen({ dest, checkIn, checkOut, guests, petFriendly, favourites, beenThere, onToggleFav, onToggleBeenThere, onBack }) {
  const [shareState, setShareState] = useState(null);
  const isFav      = favourites.some(f => f.destination === dest.destination);
  const hasVisited = beenThere.includes(dest.destination);

  async function handleShare() {
    const result = await shareDestination(dest, checkIn, checkOut, guests, petFriendly);
    if (result === "copied") { setShareState("copied"); setTimeout(() => setShareState(null), 2200); }
    else if (result)         { setShareState("shared");  setTimeout(() => setShareState(null), 2200); }
  }

  const airbnbUrl = buildAirbnbUrl(dest.destination, checkIn, checkOut, guests, petFriendly);
  const stayzUrl  = buildStayzUrl(dest.destination, checkIn, checkOut, guests, petFriendly);
  const mapsUrl   = buildMapsUrl(dest.destination);

  return (
    <div style={BG}><Orbs />
      <Wrap>
        <BackBtn onClick={onBack} label="← Back to results" />

        <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:22, padding:28, marginBottom:14, position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:"linear-gradient(90deg,#56c88c,#2ea868)" }} />
          <div style={{ fontSize:52, marginBottom:12 }}>{dest.emoji}</div>
          <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#56c88c", fontWeight:700, textTransform:"uppercase", marginBottom:6 }}>{dest.distance_from_sydney}</div>
          <h2 style={{ fontFamily:"'Fraunces', serif", fontWeight:900, fontSize:34, margin:"0 0 14px", color:"#f8f4ee", letterSpacing:"-0.02em", lineHeight:1.1 }}>{dest.destination}</h2>
          <p style={{ margin:"0 0 14px", fontSize:15, color:"#b0aba4", lineHeight:1.75 }}>{dest.why_go}</p>
          <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
            {(dest.best_for || []).map(tag => (
              <span key={tag} style={{ fontSize:11, padding:"4px 11px", borderRadius:20, background:"rgba(86,200,140,0.1)", color:"#56c88c", border:"1px solid rgba(86,200,140,0.22)" }}>{tag}</span>
            ))}
          </div>
        </div>

        {dest.insider_tip && (
          <div style={{ background:"rgba(255,200,80,0.06)", border:"1px solid rgba(255,200,80,0.2)", borderRadius:16, padding:"16px 18px", marginBottom:14 }}>
            <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#ffc850", fontWeight:700, textTransform:"uppercase", marginBottom:8 }}>Insider tip</div>
            <p style={{ margin:0, fontSize:14, color:"#c8c3b4", lineHeight:1.7, fontStyle:"italic" }}>💡 {dest.insider_tip}</p>
          </div>
        )}

        {dest.things_to_do && dest.things_to_do.length > 0 && (
          <div style={{ background:"rgba(255,255,255,0.035)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:16, padding:"16px 18px", marginBottom:14 }}>
            <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#56c88c", fontWeight:700, textTransform:"uppercase", marginBottom:12 }}>Things to do nearby</div>
            {dest.things_to_do.map((thing, i) => (
              <div key={i} style={{ display:"flex", gap:10, alignItems:"flex-start", marginBottom:8 }}>
                <span style={{ color:"#56c88c", fontWeight:700, fontSize:13, marginTop:1, flexShrink:0 }}>→</span>
                <span style={{ fontSize:14, color:"#b0aba4", lineHeight:1.5 }}>{thing}</span>
              </div>
            ))}
          </div>
        )}

        <div style={{ display:"flex", gap:10, marginBottom:10 }}>
          <button onClick={() => onToggleFav(dest)} style={{ flex:1, padding:14, borderRadius:13, border:"none", background: isFav ? "rgba(255,200,80,0.15)" : "rgba(255,255,255,0.06)", color: isFav ? "#ffc850" : "#9a958f", cursor:"pointer", fontWeight:700, fontSize:14, fontFamily:"'DM Sans', sans-serif" }}>
            {isFav ? "⭐ Saved" : "☆ Save"}
          </button>
          <button onClick={() => onToggleBeenThere(dest.destination)} style={{ flex:1, padding:14, borderRadius:13, border:"none", background: hasVisited ? "rgba(168,120,255,0.15)" : "rgba(255,255,255,0.06)", color: hasVisited ? "#b088ff" : "#9a958f", cursor:"pointer", fontWeight:700, fontSize:14, fontFamily:"'DM Sans', sans-serif" }}>
            {hasVisited ? "✓ Been there" : "📍 Been there?"}
          </button>
          <button onClick={handleShare} style={{ width:50, padding:14, borderRadius:13, border:"none", background: shareState ? "rgba(86,200,140,0.15)" : "rgba(255,255,255,0.06)", color: shareState ? "#56c88c" : "#9a958f", cursor:"pointer", fontSize:16, fontFamily:"'DM Sans', sans-serif" }}>
            {shareState === "copied" ? "✓" : "↗"}
          </button>
        </div>
        {shareState === "copied" && <div style={{ fontSize:12, color:"#56c88c", textAlign:"right", marginBottom:10 }}>Copied to clipboard!</div>}

        <a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={{ display:"flex", alignItems:"center", gap:10, padding:"14px 18px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:13, textDecoration:"none", color:"#9a958f", fontSize:14, fontWeight:600, marginBottom:12 }}>
          <span style={{ fontSize:18 }}>🗺️</span><span>Open in Google Maps</span><span style={{ marginLeft:"auto", opacity:0.5 }}>→</span>
        </a>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          <a href={airbnbUrl} target="_blank" rel="noopener noreferrer" style={{ display:"block", textAlign:"center", padding:15, background:"linear-gradient(135deg,#56c88c,#2ea868)", color:"#071a10", borderRadius:13, fontWeight:700, fontSize:14, textDecoration:"none" }}>Airbnb →</a>
          <a href={stayzUrl}  target="_blank" rel="noopener noreferrer" style={{ display:"block", textAlign:"center", padding:15, background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.13)", color:"#f0ede6", borderRadius:13, fontWeight:700, fontSize:14, textDecoration:"none" }}>Stayz →</a>
        </div>
      </Wrap>
    </div>
  );
}

// ── HISTORY CARD ──────────────────────────────────────────────
function HistoryCard({ entry, onRerun }) {
  const vibe  = VIBES.find(v => v.id === entry.vibe);
  const group = GROUPS.find(g => g.id === entry.group);
  return (
    <button onClick={() => onRerun(entry)} style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"14px 16px", display:"flex", alignItems:"center", gap:12, cursor:"pointer", textAlign:"left", width:"100%", fontFamily:"'DM Sans', sans-serif" }}>
      <span style={{ fontSize:22, flexShrink:0 }}>{vibe?.emoji}</span>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:13, fontWeight:700, color:"#c8c3b8", marginBottom:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
          {vibe?.label} · {entry.distance}hr · {group?.label}
        </div>
        <div style={{ fontSize:11, color:"#5a5550" }}>{entry.checkIn} → {entry.checkOut}</div>
      </div>
      <span style={{ fontSize:13, color:"#56c88c", fontWeight:700, flexShrink:0 }}>Rerun →</span>
    </button>
  );
}

// ── SAVED SCREEN ──────────────────────────────────────────────
function SavedScreen({ favourites, beenThere, onToggleFav, onToggleBeenThere, onBack, onResetKey }) {
  const { checkIn, checkOut } = getNextWeekend();
  return (
    <div style={BG}><Orbs />
      <Wrap>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:28 }}>
          <BackBtn onClick={onBack} label="← Back" />
          <button onClick={onResetKey} style={{ background:"rgba(255,80,80,0.08)", border:"1px solid rgba(255,80,80,0.2)", borderRadius:20, padding:"6px 14px", color:"#ff8080", fontSize:12, cursor:"pointer", fontFamily:"'DM Sans', sans-serif", fontWeight:600 }}>
            🔑 Reset API key
          </button>
        </div>

        <div style={{ marginBottom:28 }}>
          <div style={{ fontSize:11, letterSpacing:"0.2em", color:"#ffc850", textTransform:"uppercase", fontWeight:700, marginBottom:8 }}>Saved spots</div>
          <H2>Your bolthole list</H2>
          <p style={{ fontSize:14, color:"#7a7570", margin:"6px 0 0" }}>
            {favourites.length === 0 ? "Nothing saved yet — star a destination to save it." : `${favourites.length} place${favourites.length !== 1 ? "s" : ""} on your list`}
          </p>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
          {favourites.map((dest, i) => (
            <DestinationCard key={dest.destination} dest={dest} index={i}
              checkIn={checkIn} checkOut={checkOut} guests={2} petFriendly={false}
              favourites={favourites} beenThere={beenThere}
              onToggleFav={onToggleFav} onToggleBeenThere={onToggleBeenThere}
              onOpenDetail={() => {}}
            />
          ))}
        </div>
      </Wrap>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────
function App() {
  const [screen, setScreen]           = useState("home");
  const [detailDest, setDetailDest]   = useState(null);
  const [vibe, setVibe]               = useState(null);
  const [distance, setDistance]       = useState("3");
  const [group, setGroup]             = useState("couple");
  const { checkIn: defaultIn, checkOut: defaultOut } = getNextWeekend();
  const [checkIn, setCheckIn]         = useState(defaultIn);
  const [checkOut, setCheckOut]       = useState(defaultOut);
  const [loading, setLoading]         = useState(false);
  const [results, setResults]         = useState(null);
  const [error, setError]             = useState(null);
  const [statusMsg, setStatusMsg]     = useState("");
  const [petFriendly, setPetFriendly] = useState(false);
  const [apiKey, setApiKey]           = useState(() => ls.str("skedaddle_apikey", ""));
  const [favourites, setFavourites]   = useState(() => ls.get("skedaddle_favs", []));
  const [beenThere, setBeenThere]     = useState(() => ls.get("skedaddle_been", []));
  const [history, setHistory]         = useState(() => ls.get("skedaddle_history", []));

  const selectedGroup = GROUPS.find(g => g.id === group);
  const selectedVibe  = VIBES.find(v => v.id === vibe);
  const season        = getSeason();

  function toggleFav(dest) {
    setFavourites(prev => {
      const next = prev.some(f => f.destination === dest.destination) ? prev.filter(f => f.destination !== dest.destination) : [...prev, dest];
      ls.set("skedaddle_favs", next); return next;
    });
  }

  function toggleBeenThere(name) {
    setBeenThere(prev => {
      const next = prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name];
      ls.set("skedaddle_been", next); return next;
    });
  }

  function addToHistory(entry) {
    setHistory(prev => {
      const filtered = prev.filter(h => !(h.vibe === entry.vibe && h.distance === entry.distance && h.group === entry.group));
      const next = [entry, ...filtered].slice(0, 3);
      ls.set("skedaddle_history", next); return next;
    });
  }

  function rerunSearch(entry) {
    setVibe(entry.vibe); setDistance(entry.distance); setGroup(entry.group);
    setCheckIn(entry.checkIn); setCheckOut(entry.checkOut); setPetFriendly(entry.petFriendly);
    runFetch({ ...entry });
  }

  async function runFetch(overrides = {}) {
    const useVibe     = overrides.vibe      ?? vibe;
    const useDistance = overrides.distance  ?? distance;
    const useGroup    = overrides.group     ?? group;
    const useCheckIn  = overrides.checkIn   ?? checkIn;
    const useCheckOut = overrides.checkOut  ?? checkOut;
    const usePet      = overrides.petFriendly ?? petFriendly;
    const useVibeObj  = VIBES.find(v => v.id === useVibe);
    const useGroupObj = GROUPS.find(g => g.id === useGroup);

    setLoading(true); setError(null); setResults(null); setScreen("results");
    addToHistory({ vibe: useVibe, distance: useDistance, group: useGroup, checkIn: useCheckIn, checkOut: useCheckOut, petFriendly: usePet });

    const prompt = `You are a local Sydney travel expert with strong opinions. It's ${season.name} in Sydney, Australia.

A user wants to skedaddle from Sydney with these preferences:
- Vibe: ${useVibeObj?.label}
- Max drive: ${useDistance} hours from Sydney
- Group: ${useGroupObj?.label} (${useGroupObj?.guests} guests)
- Dates: ${useCheckIn} to ${useCheckOut}
- Pet friendly: ${usePet ? "YES — dog/pet friendly stays, off-leash beaches or trails" : "No"}
- Already visited (skip these): ${beenThere.length > 0 ? beenThere.join(", ") : "none"}

Use web search to find current specific destinations. Be opinionated — no generic tourist traps.

Return ONLY a valid JSON array (no markdown, no extra text) of exactly 6 objects:
{
  "destination": "Town or area name",
  "emoji": "single relevant emoji",
  "distance_from_sydney": "e.g. 2 hrs drive",
  "why_go": "2-3 punchy sentences on why this is the pick for this vibe and season",
  "best_for": ["tag1", "tag2", "tag3"],
  "insider_tip": "one very specific local tip",
  "things_to_do": ["activity 1", "activity 2", "activity 3", "activity 4"]
}`;

    try {
      setStatusMsg("Finding your next skedaddle...");
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type":"application/json", "x-api-key": apiKey, "anthropic-version":"2023-06-01" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 1500,
          tools: [{ type:"web_search_20250305", name:"web_search" }],
          messages: [{ role:"user", content: prompt }],
        }),
      });
      const data  = await response.json();
      const text  = data.content.filter(b => b.type === "text").map(b => b.text).join("");
      const clean = text.replace(/```json|```/g, "").trim();
      setResults(JSON.parse(clean));
    } catch {
      setError("Couldn't find escapes right now. Give it another go!");
    } finally {
      setLoading(false); setStatusMsg("");
    }
  }

  // ── GATE ──
  if (!apiKey) return <ApiKeyScreen onSave={key => setApiKey(key)} />;

  // ── DETAIL ──
  if (screen === "detail" && detailDest) return (
    <DetailScreen dest={detailDest} checkIn={checkIn} checkOut={checkOut}
      guests={selectedGroup?.guests ?? 2} petFriendly={petFriendly}
      favourites={favourites} beenThere={beenThere}
      onToggleFav={toggleFav} onToggleBeenThere={toggleBeenThere}
      onBack={() => setScreen("results")}
    />
  );

  // ── SAVED ──
  if (screen === "saved") return (
    <SavedScreen favourites={favourites} beenThere={beenThere}
      onToggleFav={toggleFav} onToggleBeenThere={toggleBeenThere}
      onBack={() => setScreen("home")}
      onResetKey={() => { ls.del("skedaddle_apikey"); setApiKey(""); }}
    />
  );

  // ── HOME ──
  if (screen === "home") return (
    <div style={BG}><Orbs />
      <Wrap pad="56px 24px 40px">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:32 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:22 }}>🏃</span>
            <span style={{ fontFamily:"'Fraunces', serif", fontWeight:900, fontSize:20, color:"#f8f4ee", letterSpacing:"-0.02em" }}>Skedaddle</span>
          </div>
          <SavedBadge count={favourites.length} onClick={() => setScreen("saved")} />
        </div>

        <div style={{ background:"rgba(255,200,80,0.07)", border:"1px solid rgba(255,200,80,0.2)", borderRadius:16, padding:"16px 18px", marginBottom:32, display:"flex", gap:14, alignItems:"center" }}>
          <span style={{ fontSize:28, flexShrink:0 }}>{season.emoji}</span>
          <div>
            <div style={{ fontWeight:700, fontSize:14, color:"#ffc850", marginBottom:3 }}>{season.banner}</div>
            <div style={{ fontSize:13, color:"#8a8070" }}>{season.sub}</div>
          </div>
        </div>

        <div style={{ fontSize:12, letterSpacing:"0.2em", color:"#ffc850", textTransform:"uppercase", fontWeight:700, marginBottom:16 }}>
          Weekend escapes from Sydney
        </div>
        <H1>Time to<br /><span style={{ color:"#56c88c" }}>skedaddle.</span></H1>
        <p style={{ fontSize:15, color:"#7a7570", lineHeight:1.7, margin:"0 0 36px", maxWidth:320 }}>
          Tell us your vibe. We'll find where to bolt to this weekend — fresh ideas every time.
        </p>

        {history.length > 0 && (
          <div style={{ marginBottom:32 }}>
            <Label>Recent searches</Label>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {history.map((entry, i) => <HistoryCard key={i} entry={entry} onRerun={rerunSearch} />)}
            </div>
          </div>
        )}

        <GreenBtn onClick={() => setScreen("filters")}>Let's go 🏃 →</GreenBtn>
      </Wrap>
    </div>
  );

  // ── FILTERS ──
  if (screen === "filters") return (
    <div style={BG}><Orbs />
      <Wrap>
        <BackBtn onClick={() => setScreen("home")} />
        <h2 style={{ fontFamily:"'Fraunces', serif", fontSize:34, fontWeight:900, margin:"0 0 30px", color:"#f8f4ee", letterSpacing:"-0.02em" }}>
          Plan the skedaddle
        </h2>

        <Section label="When are you going?">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            {[{ label:"Check in", value:checkIn, set:setCheckIn }, { label:"Check out", value:checkOut, set:setCheckOut }].map(({ label, value, set }) => (
              <div key={label}>
                <div style={{ fontSize:11, color:"#56c88c", letterSpacing:"0.1em", marginBottom:6, textTransform:"uppercase", fontWeight:700 }}>{label}</div>
                <input type="date" value={value} onChange={e => set(e.target.value)} style={{ width:"100%", padding:12, borderRadius:11, background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.11)", color:"#f0ede6", fontSize:14, fontFamily:"'DM Sans', sans-serif", outline:"none", colorScheme:"dark" }} />
              </div>
            ))}
          </div>
        </Section>

        <Section label="Who's coming?">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {GROUPS.map(g => (
              <OptionCard key={g.id} selected={group === g.id} onClick={() => setGroup(g.id)}>
                <span style={{ fontSize:22 }}>{g.emoji}</span>
                <span style={{ fontSize:14, fontWeight:600 }}>{g.label}</span>
              </OptionCard>
            ))}
          </div>
        </Section>

        <Section label="How far will you drive?">
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {DISTANCES.map(d => (
              <OptionCard key={d.id} selected={distance === d.id} onClick={() => setDistance(d.id)} horizontal>
                <div>
                  <div style={{ fontWeight:700, fontSize:15 }}>{d.label}</div>
                  <div style={{ fontSize:12, color:"#6a6560", marginTop:2 }}>{d.desc}</div>
                </div>
              </OptionCard>
            ))}
          </div>
        </Section>

        <Section label="What's the vibe?">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {VIBES.map(v => (
              <OptionCard key={v.id} selected={vibe === v.id} onClick={() => setVibe(v.id)}>
                <span style={{ fontSize:24 }}>{v.emoji}</span>
                <span style={{ fontSize:13, fontWeight:600, textAlign:"center" }}>{v.label}</span>
              </OptionCard>
            ))}
          </div>
        </Section>

        <Section label="Any extras?">
          <button onClick={() => setPetFriendly(p => !p)} style={{ width:"100%", padding:"16px 20px", borderRadius:14, background: petFriendly ? "rgba(255,200,80,0.1)" : "rgba(255,255,255,0.04)", border: petFriendly ? "1px solid rgba(255,200,80,0.4)" : "1px solid rgba(255,255,255,0.08)", color: petFriendly ? "#ffc850" : "#9a958f", cursor:"pointer", display:"flex", alignItems:"center", gap:14, fontFamily:"'DM Sans', sans-serif", transition:"all 0.2s" }}>
            <span style={{ fontSize:26 }}>🐾</span>
            <div style={{ textAlign:"left", flex:1 }}>
              <div style={{ fontWeight:700, fontSize:15 }}>Bringing a pet?</div>
              <div style={{ fontSize:12, opacity:0.65, marginTop:2 }}>Filter for pet-friendly stays & destinations</div>
            </div>
            <div style={{ width:44, height:26, borderRadius:13, background: petFriendly ? "#ffc850" : "rgba(255,255,255,0.1)", position:"relative", flexShrink:0, transition:"background 0.2s" }}>
              <div style={{ position:"absolute", top:3, left: petFriendly ? 21 : 3, width:20, height:20, borderRadius:"50%", background:"#fff", transition:"left 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.3)" }} />
            </div>
          </button>
        </Section>

        <GreenBtn onClick={() => runFetch()} disabled={!vibe}>Skedaddle! ✨</GreenBtn>
      </Wrap>
    </div>
  );

  // ── RESULTS ──
  return (
    <div style={BG}><Orbs />
      <Wrap>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:26 }}>
          <BackBtn onClick={() => setScreen("filters")} label="← Change filters" />
          <SavedBadge count={favourites.length} onClick={() => setScreen("saved")} />
        </div>

        <div style={{ marginBottom:28 }}>
          <div style={{ fontSize:11, letterSpacing:"0.18em", color:"#56c88c", textTransform:"uppercase", fontWeight:700, marginBottom:8 }}>
            {selectedVibe?.emoji} {selectedVibe?.label} · {distance}hr · {selectedGroup?.label}{petFriendly ? " · 🐾" : ""}
          </div>
          <H2>Time to skedaddle!</H2>
        </div>

        {loading && (
          <div style={{ textAlign:"center", padding:"80px 0" }}>
            <div style={{ fontSize:42, marginBottom:20, display:"inline-block", animation:"bounce 0.8s ease-in-out infinite alternate" }}>🏃</div>
            <div style={{ color:"#56c88c", fontSize:14, letterSpacing:"0.1em" }}>{statusMsg}</div>
          </div>
        )}

        {error && (
          <div style={{ textAlign:"center", padding:"60px 0" }}>
            <div style={{ fontSize:32, marginBottom:16 }}>😅</div>
            <div style={{ color:"#9a958f", marginBottom:24 }}>{error}</div>
            <button onClick={() => runFetch()} style={{ padding:"12px 28px", borderRadius:12, background:"#56c88c", color:"#071a10", border:"none", cursor:"pointer", fontWeight:700, fontFamily:"'DM Sans', sans-serif" }}>Try again</button>
          </div>
        )}

        {results && (
          <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
            {results.map((dest, i) => (
              <DestinationCard key={i} dest={dest} index={i}
                checkIn={checkIn} checkOut={checkOut} guests={selectedGroup?.guests}
                petFriendly={petFriendly} favourites={favourites} beenThere={beenThere}
                onToggleFav={toggleFav} onToggleBeenThere={toggleBeenThere}
                onOpenDetail={dest => { setDetailDest(dest); setScreen("detail"); }}
              />
            ))}
            <button onClick={() => runFetch()} style={{ marginTop:8, padding:16, borderRadius:14, background:"rgba(86,200,140,0.08)", border:"1px solid rgba(86,200,140,0.22)", color:"#56c88c", cursor:"pointer", fontSize:15, fontWeight:700, fontFamily:"'DM Sans', sans-serif" }}>
              🏃 Skedaddle somewhere else
            </button>
          </div>
        )}
      </Wrap>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
