function buildAirbnbUrl(destination, checkIn, checkOut, guests, petFriendly) {
  const params = new URLSearchParams({
    query: `${destination}, NSW, Australia`,
    checkin: checkIn, checkout: checkOut, adults: guests,
    refinement_paths: "/homes", search_type: "filter_change",
  });
  if (petFriendly) params.set("amenities[]", "25");
  return `${AIRBNB_BASE}/${encodeURIComponent(destination + ", NSW")}/homes?${params}`;
}

function buildStayzUrl(destination, checkIn, checkOut, guests, petFriendly) {
  const params = new URLSearchParams({ q: `${destination} NSW`, arrival: checkIn, departure: checkOut, adults: guests });
  if (petFriendly) params.set("pets", "1");
  return `${STAYZ_BASE}?${params}`;
}

function buildMapsUrl(dest) {
  return `https://maps.google.com/?q=${encodeURIComponent(dest + ", NSW, Australia")}`;
}

function formatDate(d) { return d.toISOString().split("T")[0]; }

function getNextWeekend() {
  const today = new Date();
  const daysToFriday = (5 - today.getDay() + 7) % 7 || 7;
  const friday = new Date(today);
  friday.setDate(today.getDate() + daysToFriday);
  const sunday = new Date(friday);
  sunday.setDate(friday.getDate() + 2);
  return { checkIn: formatDate(friday), checkOut: formatDate(sunday) };
}

function getSeason() {
  const m = new Date().getMonth();
  if (m >= 2 && m <= 4) return { name: "autumn", emoji: "🍂", banner: "Autumn colour & crisp air",   sub: "Perfect for wine country & mountain drives" };
  if (m >= 5 && m <= 7) return { name: "winter", emoji: "🔥", banner: "Winter cabin season is here", sub: "Log fires, misty valleys & cosy stays" };
  if (m >= 8 && m <= 10) return { name: "spring", emoji: "🌸", banner: "Spring is popping off",       sub: "Wildflowers, warm days & outdoor escapes" };
  return { name: "summer", emoji: "☀️", banner: "Summer escape time", sub: "Beaches, waterfalls & long evenings" };
}

const ls = {
  get: (k, fb) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fb; } catch { return fb; } },
  set: (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  str: (k, fb) => { try { return localStorage.getItem(k) || fb; } catch { return fb; } },
  setStr: (k,v)=> { try { localStorage.setItem(k, v); } catch {} },
  del: (k)     => { try { localStorage.removeItem(k); } catch {} },
};

async function shareDestination(dest, checkIn, checkOut, guests, petFriendly) {
  const url = buildAirbnbUrl(dest.destination, checkIn, checkOut, guests, petFriendly);
  const text = `${dest.emoji} ${dest.destination} — ${dest.distance_from_sydney} from Sydney\n\n${dest.why_go}\n\n💡 ${dest.insider_tip}\n\nSearch Airbnb: ${url}`;
  if (navigator.share) { try { await navigator.share({ title: `Skedaddle to ${dest.destination}`, text }); return true; } catch {} }
  try { await navigator.clipboard.writeText(text); return "copied"; } catch {}
  return false;
}

function SettingsScreen({ currentKey, onSave, onBack }) {
  const [key, setKey]         = useState(currentKey ? "••••••••••••••••" : "");
  const [editing, setEditing] = useState(!currentKey);
  const [error, setError]     = useState("");
  const [testing, setTesting] = useState(false);
  const [saved, setSaved]     = useState(false);

  async function handleSave() {
    const trimmed = key.trim();
    if (!trimmed.startsWith("sk-ant-")) { setError("Anthropic keys start with sk-ant-"); return; }
    setTesting(true); setError("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type":"application/json", "x-api-key": trimmed, "anthropic-version":"2023-06-01" },
        body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens:10, messages:[{ role:"user", content:"hi" }] }),
      });
      if (res.status === 401) { setError("Invalid key — double-check and try again."); setTesting(false); return; }
      ls.setStr("skedaddle_apikey", trimmed);
      onSave(trimmed); setEditing(false); setKey("••••••••••••••••"); setSaved(true);
    } catch { setError("Couldn't verify the key. Check your connection."); }
    setTesting(false);
  }

  function handleClear() {
    if (!window.confirm("Remove your API key? You'll need to re-enter it to use Skedaddle.")) return;
    ls.del("skedaddle_apikey"); onSave(""); setKey(""); setEditing(true); setSaved(false);
  }

  function handleClearData(type) {
    const labels = { favs:"saved places", been:"been there list", history:"search history" };
    if (!window.confirm(`Clear your ${labels[type]}?`)) return;
    ls.del(`skedaddle_${type}`); window.location.reload();
  }

  return (
    <div style={BG}><Orbs />
      <Wrap>
        <BackBtn onClick={onBack} />
        <div style={{ fontSize:12, letterSpacing:"0.2em", color:"#ffc850", textTransform:"uppercase", fontWeight:700, marginBottom:12 }}>Settings</div>
        <h2 style={{ fontFamily:"'Fraunces', serif", fontSize:34, fontWeight:900, margin:"0 0 32px", color:"#f8f4ee", letterSpacing:"-0.02em" }}>Your preferences</h2>

        <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:18, padding:22, marginBottom:14 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
            <div>
              <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#56c88c", fontWeight:700, textTransform:"uppercase", marginBottom:4 }}>Anthropic API Key</div>
              <div style={{ fontSize:13, color:"#6a6560" }}>Used to power AI destination search</div>
            </div>
            {!editing && currentKey && <button onClick={() => { setKey(""); setEditing(true); setSaved(false); setError(""); }} style={{ background:"rgba(86,200,140,0.1)", border:"1px solid rgba(86,200,140,0.25)", borderRadius:10, padding:"6px 12px", color:"#56c88c", fontSize:12, cursor:"pointer", fontFamily:"'DM Sans', sans-serif", fontWeight:600 }}>Change</button>}
          </div>
          {editing ? (
            <>
              <input type="password" placeholder="sk-ant-api03-..." value={key} onChange={e => { setKey(e.target.value); setError(""); setSaved(false); }} autoFocus
                style={{ width:"100%", padding:"12px 14px", borderRadius:11, background:"rgba(255,255,255,0.05)", border:error?"1px solid rgba(255,80,80,0.5)":"1px solid rgba(255,255,255,0.12)", color:"#f0ede6", fontSize:14, fontFamily:"'DM Sans', sans-serif", outline:"none", marginBottom:10 }} />
              {error && <div style={{ fontSize:12, color:"#ff6060", marginBottom:10 }}>⚠️ {error}</div>}
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={handleSave} disabled={!key.trim()||testing} style={{ flex:1, padding:11, borderRadius:10, background:key.trim()&&!testing?"linear-gradient(135deg,#56c88c,#2ea868)":"rgba(255,255,255,0.06)", color:key.trim()&&!testing?"#071a10":"#444", border:"none", cursor:key.trim()&&!testing?"pointer":"not-allowed", fontWeight:700, fontSize:13, fontFamily:"'DM Sans', sans-serif" }}>{testing?"Verifying...":"Save key"}</button>
                {currentKey && <button onClick={() => { setEditing(false); setKey("••••••••••••••••"); setError(""); }} style={{ padding:"11px 16px", borderRadius:10, background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", color:"#9a958f", cursor:"pointer", fontSize:13, fontFamily:"'DM Sans', sans-serif" }}>Cancel</button>}
              </div>
            </>
          ) : (
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ flex:1, padding:"11px 14px", borderRadius:10, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", fontSize:14, color:"#56c88c", fontFamily:"monospace", letterSpacing:"0.1em" }}>{saved?"✓ Key saved":"sk-ant-••••••••••••"}</div>
              <button onClick={handleClear} style={{ padding:"11px 14px", borderRadius:10, background:"rgba(255,80,80,0.08)", border:"1px solid rgba(255,80,80,0.18)", color:"#ff8080", cursor:"pointer", fontSize:13, fontFamily:"'DM Sans', sans-serif", fontWeight:600 }}>Remove</button>
            </div>
          )}
          <div style={{ marginTop:12, fontSize:12, color:"#5a5550", lineHeight:1.6 }}>🔒 Stored in localStorage on this device only. <a href="https://console.anthropic.com/keys" target="_blank" rel="noopener noreferrer" style={{ color:"#56c88c", textDecoration:"none" }}>Get a key →</a></div>
        </div>

        <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:18, padding:22, marginBottom:14 }}>
          <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#56c88c", fontWeight:700, textTransform:"uppercase", marginBottom:16 }}>Data & Storage</div>
          {[{key:"favs",label:"Saved places",icon:"⭐",desc:"Your bolthole list"},{key:"been",label:"Been there list",icon:"📍",desc:"Places you've visited"},{key:"history",label:"Search history",icon:"🕓",desc:"Your last 3 searches"}].map(item => (

              <span style={{ fontSize:18, width:28, textAlign:"center", flexShrink:0 }}>{item.icon}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:600, color:"#c8c3b8" }}>{item.label}</div>
                <div style={{ fontSize:11, color:"#5a5550" }}>{item.desc}</div>
              </div>
              <button onClick={() => handleClearData(item.key)} style={{ padding:"6px 12px", borderRadius:9, background:"rgba(255,80,80,0.08)", border:"1px solid rgba(255,80,80,0.18)", color:"#ff8080", fontSize:11, cursor:"pointer", fontFamily:"'DM Sans', sans-serif", fontWeight:600, flexShrink:0 }}>Clear</button>
            </div>
          ))}
        </div>

        <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:18, padding:22 }}>
          <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#56c88c", fontWeight:700, textTransform:"uppercase", marginBottom:14 }}>About</div>
          {[{label:"App",value:"Skedaddle"},{label:"Version",value:"1.0.0"},{label:"Model",value:"claude-sonnet-4"},{label:"Privacy",value:<a href="PRIVACY.md" target="_blank" style={{ color:"#56c88c", textDecoration:"none" }}>View policy →</a>}].map(row => (

              <span style={{ fontSize:13, color:"#6a6560" }}>{row.label}</span>
              <span style={{ fontSize:13, color:"#c8c3b8", fontWeight:600 }}>{row.value}</span>

  const { checkIn: defaultIn, checkOut: defaultOut } = getNextWeekend();
  const [checkIn, setCheckIn]         = useState(defaultIn);
  const [checkOut, setCheckOut]       = useState(defaultOut);
  const [loading, setLoading]         = useState(false);
  const [results, setResults]         = useState(null);
  const [error, setError]             = useState(null);
  const [statusMsg, setStatusMsg]     = useState("");
  const [petFriendly, setPetFriendly] = useState(false);
  const [apiKey, setApiKey]           = useState(() => ls.str("skedaddle_apikey", ""));
  const [favourites, setFavourites]   = useState(() => ls.get("skedaddle_favs", []));
  const [beenThere, setBeenThere]     = useState(() => ls.get("skedaddle_been", []));
  const [history, setHistory]         = useState(() => ls.get("skedaddle_history", []));

  const selectedGroup = GROUPS.find(g => g.id === group);
  const selectedVibe  = VIBES.find(v => v.id === vibe);
  const season        = getSeason();

  function goSettings() { setPrevScreen(screen); setScreen("settings"); }

  function toggleFav(dest) {
    setFavourites(prev => { const next = prev.some(f => f.destination===dest.destination)?prev.filter(f=>f.destination!==dest.destination):[...prev,dest]; ls.set("skedaddle_favs",next); return next; });
  }
  function toggleBeenThere(name) {
    setBeenThere(prev => { const next = prev.includes(name)?prev.filter(n=>n!==name):[...prev,name]; ls.set("skedaddle_been",next); return next; });
  }
  function addToHistory(entry) {
    setHistory(prev => { const filtered=prev.filter(h=>!(h.vibe===entry.vibe&&h.distance===entry.distance&&h.group===entry.group)); const next=[entry,...filtered].slice(0,3); ls.set("skedaddle_history",next); return next; });
  }
  function rerunSearch(entry) {
    setVibe(entry.vibe); setDistance(entry.distance); setGroup(entry.group);
    setCheckIn(entry.checkIn); setCheckOut(entry.checkOut); setPetFriendly(entry.petFriendly);
    runFetch({...entry});
  }

  async function runFetch(overrides={}) {
    const useVibe=overrides.vibe??vibe, useDistance=overrides.distance??distance, useGroup=overrides.group??group;
    const useCheckIn=overrides.checkIn??checkIn, useCheckOut=overrides.checkOut??checkOut, usePet=overrides.petFriendly??petFriendly;
    const useVibeObj=VIBES.find(v=>v.id===useVibe), useGroupObj=GROUPS.find(g=>g.id===useGroup);

    setLoading(true); setError(null); setResults(null); setScreen("results");
    addToHistory({vibe:useVibe,distance:useDistance,group:useGroup,checkIn:useCheckIn,checkOut:useCheckOut,petFriendly:usePet});

    const prompt = `You are a local Sydney travel expert with strong opinions. It's ${season.name} in Sydney, Australia.

A user wants to skedaddle from Sydney with these preferences:
- Vibe: ${useVibeObj?.label}
- Max drive: ${useDistance} hours from Sydney
- Group: ${useGroupObj?.label} (${useGroupObj?.guests} guests)
- Dates: ${useCheckIn} to ${useCheckOut}
- Pet friendly: ${usePet?"YES — dog/pet friendly stays, off-leash beaches or trails":"No"}
- Already visited (skip these): ${beenThere.length>0?beenThere.join(", "):"none"}

Use web search to find current specific destinations. Be opinionated — no generic tourist traps.

Return ONLY a valid JSON array (no markdown, no extra text) of exactly 6 objects:
{"destination":"Town or area name","emoji":"single relevant emoji","distance_from_sydney":"e.g. 2 hrs drive","why_go":"2-3 punchy sentences","best_for":["tag1","tag2","tag3"],"insider_tip":"one very specific local tip","things_to_do":["activity 1","activity 2","activity 3","activity 4"]}`;

    try {
      setStatusMsg("Finding your next skedaddle...");
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:prompt}]}),
      });
      const data=await response.json();
      const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      setResults(JSON.parse(text.replace(/```json|```/g,"").trim()));
    } catch { setError("Couldn't find escapes right now. Give it another go!"); }
    finally { setLoading(false); setStatusMsg(""); }
  }

  // ── ONBOARDING GATE ──
  if (!onboarded) return <OnboardingScreen onDone={() => { ls.set("skedaddle_onboarded", true); setOnboarded(true); }} />;
  if (screen==="detail"&&detailDest) return <DetailScreen dest={detailDest} checkIn={checkIn} checkOut={checkOut} guests={selectedGroup?.guests??2} petFriendly={petFriendly} favourites={favourites} beenThere={beenThere} onToggleFav={toggleFav} onToggleBeenThere={toggleBeenThere} onBack={()=>setScreen("results")} />;
  if (screen==="settings") return <SettingsScreen currentKey={apiKey} onSave={k=>setApiKey(k)} onBack={()=>setScreen(prevScreen||"home")} />;
  if (screen==="saved") return <SavedScreen favourites={favourites} beenThere={beenThere} onToggleFav={toggleFav} onToggleBeenThere={toggleBeenThere} onBack={()=>setScreen("home")} onOpenSettings={goSettings} />;

  if (screen==="home") return (
    <div style={BG}><Orbs />
      <Wrap pad="56px 24px 40px">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:32 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:22 }}>🏃</span>
            <span style={{ fontFamily:"'Fraunces', serif", fontWeight:900, fontSize:20, color:"#f8f4ee", letterSpacing:"-0.02em" }}>Skedaddle</span>
          </div>
          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
            <SavedBadge count={favourites.length} onClick={()=>setScreen("saved")} />
            <button onClick={goSettings} style={{ width:36, height:36, borderRadius:"50%", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", color:"#9a958f", fontSize:16, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>⚙️</button>
          </div>
        </div>
        <div style={{ background:"rgba(255,200,80,0.07)", border:"1px solid rgba(255,200,80,0.2)", borderRadius:16, padding:"16px 18px", marginBottom:32, display:"flex", gap:14, alignItems:"center" }}>
          <span style={{ fontSize:28, flexShrink:0 }}>{season.emoji}</span>
          <div>
            <div style={{ fontWeight:700, fontSize:14, color:"#ffc850", marginBottom:3 }}>{season.banner}</div>
            <div style={{ fontSize:13, color:"#8a8070" }}>{season.sub}</div>
          </div>
        </div>
        {!apiKey && (
          <div onClick={goSettings} style={{ background:"rgba(255,200,80,0.08)", border:"1px solid rgba(255,200,80,0.25)", borderRadius:14, padding:"12px 16px", marginBottom:20, display:"flex", alignItems:"center", gap:12, cursor:"pointer" }}>
            <span style={{ fontSize:20, flexShrink:0 }}>🔑</span>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, fontWeight:700, color:"#ffc850", marginBottom:2 }}>Add your API key to get started</div>
              <div style={{ fontSize:12, color:"#8a8070" }}>Tap to open Settings and paste your Anthropic key</div>
            </div>
            <span style={{ fontSize:12, color:"#ffc850", opacity:0.7 }}>→</span>
          </div>
        )}
        <div style={{ fontSize:12, letterSpacing:"0.2em", color:"#ffc850", textTransform:"uppercase", fontWeight:700, marginBottom:16 }}>Weekend escapes from Sydney</div>
        <H1>Time to<br /><span style={{ color:"#56c88c" }}>skedaddle.</span></H1>
        <p style={{ fontSize:15, color:"#7a7570", lineHeight:1.7, margin:"0 0 36px", maxWidth:320 }}>Tell us your vibe. We'll find where to bolt to this weekend — fresh ideas every time.</p>
        {history.length>0&&(
          <div style={{ marginBottom:32 }}>
            <Label>Recent searches</Label>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {history.map((entry,i)=><HistoryCard key={i} entry={entry} onRerun={rerunSearch} />)}
            </div>
          </div>
        )}
        <GreenBtn onClick={()=>{ if(!apiKey){goSettings();return;} setScreen("filters"); }}>
          {apiKey ? "Let's go 🏃 →" : "Add API key to start →"}
        </GreenBtn>
      </Wrap>
    </div>
  );

  if (screen==="filters") return (
    <div style={BG}><Orbs />
      <Wrap>
        <BackBtn onClick={()=>setScreen("home")} />
        <h2 style={{ fontFamily:"'Fraunces', serif", fontSize:34, fontWeight:900, margin:"0 0 30px", color:"#f8f4ee", letterSpacing:"-0.02em" }}>Plan the skedaddle</h2>
        <Section label="When are you going?">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            {[{label:"Check in",value:checkIn,set:setCheckIn},{label:"Check out",value:checkOut,set:setCheckOut}].map(({label,value,set})=>(
              <div key={label}>
                <div style={{ fontSize:11, color:"#56c88c", letterSpacing:"0.1em", marginBottom:6, textTransform:"uppercase", fontWeight:700 }}>{label}</div>
                <input type="date" value={value} onChange={e=>set(e.target.value)} style={{ width:"100%", padding:12, borderRadius:11, background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.11)", color:"#f0ede6", fontSize:14, fontFamily:"'DM Sans', sans-serif", outline:"none", colorScheme:"dark" }} />
              </div>
            ))}
          </div>
        </Section>
        <Section label="Who's coming?">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {GROUPS.map(g=><OptionCard key={g.id} selected={group===g.id} onClick={()=>setGroup(g.id)}><span style={{ fontSize:22 }}>{g.emoji}</span><span style={{ fontSize:14, fontWeight:600 }}>{g.label}</span></OptionCard>)}
          </div>
        </Section>
        <Section label="How far will you drive?">
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {DISTANCES.map(d=><OptionCard key={d.id} selected={distance===d.id} onClick={()=>setDistance(d.id)} horizontal><div><div style={{ fontWeight:700, fontSize:15 }}>{d.label}</div><div style={{ fontSize:12, color:"#6a6560", marginTop:2 }}>{d.desc}</div></div></OptionCard>)}
          </div>
        </Section>
        <Section label="What's the vibe?">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {VIBES.map(v=><OptionCard key={v.id} selected={vibe===v.id} onClick={()=>setVibe(v.id)}><span style={{ fontSize:24 }}>{v.emoji}</span><span style={{ fontSize:13, fontWeight:600, textAlign:"center" }}>{v.label}</span></OptionCard>)}
          </div>
        </Section>
        <Section label="Any extras?">
          <button onClick={()=>setPetFriendly(p=>!p)} style={{ width:"100%", padding:"16px 20px", borderRadius:14, background:petFriendly?"rgba(255,200,80,0.1)":"rgba(255,255,255,0.04)", border:petFriendly?"1px solid rgba(255,200,80,0.4)":"1px solid rgba(255,255,255,0.08)", color:petFriendly?"#ffc850":"#9a958f", cursor:"pointer", display:"flex", alignItems:"center", gap:14, fontFamily:"'DM Sans', sans-serif", transition:"all 0.2s" }}>
            <span style={{ fontSize:26 }}>🐾</span>
            <div style={{ textAlign:"left", flex:1 }}><div style={{ fontWeight:700, fontSize:15 }}>Bringing a pet?</div><div style={{ fontSize:12, opacity:0.65, marginTop:2 }}>Filter for pet-friendly stays & destinations</div></div>
            <div style={{ width:44, height:26, borderRadius:13, background:petFriendly?"#ffc850":"rgba(255,255,255,0.1)", position:"relative", flexShrink:0, transition:"background 0.2s" }}>
              <div style={{ position:"absolute", top:3, left:petFriendly?21:3, width:20, height:20, borderRadius:"50%", background:"#fff", transition:"left 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.3)" }} />
            </div>
          </button>
        </Section>
        <GreenBtn onClick={()=>runFetch()} disabled={!vibe}>Skedaddle! ✨</GreenBtn>
      </Wrap>
    </div>
  );

  return (
    <div style={BG}><Orbs />
      <Wrap>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:26 }}>
          <BackBtn onClick={()=>setScreen("filters")} label="← Change filters" />
          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
            <SavedBadge count={favourites.length} onClick={()=>setScreen("saved")} />
            <button onClick={goSettings} style={{ width:36, height:36, borderRadius:"50%", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", color:"#9a958f", fontSize:16, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>⚙️</button>
          </div>
        </div>
        <div style={{ marginBottom:28 }}>
          <div style={{ fontSize:11, letterSpacing:"0.18em", color:"#56c88c", textTransform:"uppercase", fontWeight:700, marginBottom:8 }}>{selectedVibe?.emoji} {selectedVibe?.label} · {distance}hr · {selectedGroup?.label}{petFriendly?" · 🐾":""}</div>
          <H2>Time to skedaddle!</H2>
        </div>
        {loading&&<div style={{ textAlign:"center", padding:"80px 0" }}><div style={{ fontSize:42, marginBottom:20, display:"inline-block", animation:"bounce 0.8s ease-in-out infinite alternate" }}>🏃</div><div style={{ color:"#56c88c", fontSize:14, letterSpacing:"0.1em" }}>{statusMsg}</div></div>}
        {error&&<div style={{ textAlign:"center", padding:"60px 0" }}><div style={{ fontSize:32, marginBottom:16 }}>😅</div><div style={{ color:"#9a958f", marginBottom:24 }}>{error}</div><button onClick={()=>runFetch()} style={{ padding:"12px 28px", borderRadius:12, background:"#56c88c", color:"#071a10", border:"none", cursor:"pointer", fontWeight:700, fontFamily:"'DM Sans', sans-serif" }}>Try again</button></div>}
        {results&&(
          <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
            {results.map((dest,i)=><DestinationCard key={i} dest={dest} index={i} checkIn={checkIn} checkOut={checkOut} guests={selectedGroup?.guests} petFriendly={petFriendly} favourites={favourites} beenThere={beenThere} onToggleFav={toggleFav} onToggleBeenThere={toggleBeenThere} onOpenDetail={dest=>{setDetailDest(dest);setScreen("detail");}} />)}
            <button onClick={()=>runFetch()} style={{ marginTop:8, padding:16, borderRadius:14, background:"rgba(86,200,140,0.08)", border:"1px solid rgba(86,200,140,0.22)", color:"#56c88c", cursor:"pointer", fontSize:15, fontWeight:700, fontFamily:"'DM Sans', sans-serif" }}>🏃 Skedaddle somewhere else</button>
          </div>
        )}
      </Wrap>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
