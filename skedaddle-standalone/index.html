  // props: value, onChange(displayName), onSelect(displayName)
  var sug = useState([]); var suggestions=sug[0],setSuggestions=sug[1];
  var loading = useState(false); var isLoading=loading[0],setIsLoading=loading[1];
  var open = useState(false); var isOpen=open[0],setIsOpen=open[1];
  var timerRef = useRef(null);
  var wrapRef = useRef(null);

  function search(q) {
    if (q.length < 2) { setSuggestions([]); setIsOpen(false); return; }
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(function(){
      setIsLoading(true);
      fetch("https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(q)+"&format=json&addressdetails=1&limit=6")
        .then(function(r){ return r.json(); })
        .then(function(results){
          var mapped = results.map(function(r){
            var a = r.address||{};
            var suburb = a.suburb||a.town||a.city_district||a.village||a.municipality||"";
            var state  = a.state_district||a.state||"";
            var display = suburb ? (suburb+(state?" · "+state:"")) : r.display_name.split(",").slice(0,2).join(",").trim();
            return { display:display, suburb:suburb||display };
          }).filter(function(r,i,arr){
            return r.display && arr.findIndex(function(x){ return x.display===r.display; })===i;
          });
          setSuggestions(mapped);
          setIsOpen(mapped.length > 0);
          setIsLoading(false);
        })
        .catch(function(){ setIsLoading(false); });
    }, 300);
  }

  // Close dropdown on outside click
  useEffect(function(){
    function handler(e){ if(wrapRef.current && !wrapRef.current.contains(e.target)){ setIsOpen(false); } }
    document.addEventListener("mousedown", handler);
    return function(){ document.removeEventListener("mousedown", handler); };
  }, []);

  return React.createElement("div", { ref:wrapRef, style:{ position:"relative" } },
    React.createElement("div", { style:{ position:"relative" } },
      React.createElement("input", {
        type:"text",
        placeholder:"e.g. Coogee, Seminyak, Shibuya...",
        value:props.value,
        autoFocus:true,
        onChange:function(e){ props.onChange(e.target.value); search(e.target.value); },
        onFocus:function(){ if(suggestions.length) setIsOpen(true); },
        onKeyDown:function(e){
          if(e.key==="Escape"){ setIsOpen(false); }
          if(e.key==="Enter"&&props.value.trim()){ setIsOpen(false); props.onSelect(props.value.trim()); }
        },
        style:{ width:"100%",padding:"12px 38px 12px 14px",borderRadius:12,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(86,200,140,0.35)",color:"#f0ede6",fontSize:15,outline:"none",fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box" }
      }),
      isLoading && React.createElement("div", { style:{ position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",fontSize:14,animation:"pulse 1s infinite" } }, "⏳")
    ),
    isOpen && React.createElement("div", { style:{ position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#1a2a22",border:"1px solid rgba(86,200,140,0.25)",borderRadius:12,overflow:"hidden",zIndex:100,boxShadow:"0 8px 32px rgba(0,0,0,0.5)" } },
      suggestions.map(function(s,i){
        return React.createElement("div", {
          key:i,
          onMouseDown:function(e){ e.preventDefault(); props.onSelect(s.suburb); setSuggestions([]); setIsOpen(false); },
          style:{ padding:"11px 16px",fontSize:14,color:"#f0ede6",cursor:"pointer",borderBottom:i<suggestions.length-1?"1px solid rgba(255,255,255,0.05)":"none",display:"flex",alignItems:"center",gap:10 }
        },
          React.createElement("span", { style:{ fontSize:14,flexShrink:0 } }, "📍"),
          React.createElement("span", null, s.display)

    (WORKER_URL ? "Use web search to find current, real information for today and this weekend.\n" : "") +
    "Return ONLY valid JSON (no markdown) with this structure:\n" +
    "{\"eats\":{" +

    "},\n" +

  var sub = useState(null); var suburb=sub[0],setSuburb=sub[1];
  var ld = useState(false); var loading=ld[0],setLoading=ld[1];
  var rs = useState(null); var results=rs[0],setResults=rs[1];
  var er = useState(null); var error=er[0],setError=er[1];
  var ak = useState(function(){ return ls.str("skedaddle_apikey",""); }); var apiKey=ak[0],setApiKey=ak[1];
  var pv = useState("home"); var prev=pv[0],setPrev=pv[1];
  var fv = useState(function(){ return ls.get("skedaddle_favs",{}); }); var favs=fv[0],setFavs=fv[1];

  function toggleFav(item, kind) {
    var k = favKey(item);
    setFavs(function(prev) {
      var next = Object.assign({},prev);
      if (next[k]) { delete next[k]; }
      else { next[k] = Object.assign({},item,{_kind:kind}); }
      ls.set("skedaddle_favs", next);
      return next;
    });
  }

  function goSettings() { setPrev(screen); setScreen("settings"); }

  function doSearch(s) {
    setSuburb(s); setScreen("results"); setLoading(true); setError(null); setResults(null);
    if (DEMO_MODE) {
      getMockResults(s).then(function(data){ setResults(data); setLoading(false); });
      return;
    }
    var prompt = buildPrompt(s);
    var usingWorker = !!WORKER_URL;
    var endpoint = usingWorker ? WORKER_URL : "https://api.anthropic.com/v1/messages";
    var headers = usingWorker
      ? { "Content-Type":"application/json" }
      : { "Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" };
    var body = usingWorker
      ? { messages:[{role:"user",content:prompt}] }
      : { model:"claude-sonnet-4-6",max_tokens:3500,system:"You are a helpful local guide. Return only valid JSON, no markdown.",messages:[{role:"user",content:prompt}] };
    fetch(endpoint, { method:"POST", headers:headers, body:JSON.stringify(body) })
      .then(function(res){
        if (!res.ok) {
          res.json().catch(function(){return{};}).then(function(e){
            var msg = (e&&e.error&&e.error.message)||"";
            if (res.status===401) setError("API key rejected — check Settings.");
            else if (res.status===429) setError("Rate limit hit — wait a moment and try again.");
            else setError("Error "+res.status+(msg?" — "+msg:" — please try again."));
            console.error("API error",res.status,e);
            setLoading(false);
          });
          return;
        }
        return res.json();
      })
      .then(function(data){
        if (!data) return;
        var text = (data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
        // Strip markdown code fences if present
        var cleaned = text.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
        // Find the outermost { ... } block
        var start = cleaned.indexOf("{");
        var end   = cleaned.lastIndexOf("}");
        if (start===-1||end===-1||end<=start) { setError("No data returned — try again."); setLoading(false); return; }
        var jsonStr = cleaned.slice(start, end+1);
        try {
          var parsed = JSON.parse(jsonStr);
          setResults(parsed);
        } catch(e) {
          console.error("Parse error:", e, "\nRaw:", text.slice(0,500));
          setError("Couldn't parse response — please try again.");
        }
        setLoading(false);
      })
      .catch(function(){ setError("Can't reach Anthropic — check your connection."); setLoading(false); });
  }

  if (screen==="settings") return React.createElement(SettingsScreen, { currentKey:apiKey, onSave:function(k){setApiKey(k);}, onBack:function(){setScreen(prev||"home");} });
  if (screen==="results") return React.createElement(ResultsScreen, { suburb:suburb, loading:loading, results:results, error:error, favs:favs, onToggleFav:toggleFav, onBack:function(){setScreen("home");}, onRetry:doSearch });
  return React.createElement(HomeScreen, { apiKey:apiKey, onSettings:goSettings, onSearch:doSearch });
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>
