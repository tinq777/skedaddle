<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#0d1f1a"/>
  <circle cx="72" cy="20" r="18" fill="#56c88c" opacity="0.9"/>
